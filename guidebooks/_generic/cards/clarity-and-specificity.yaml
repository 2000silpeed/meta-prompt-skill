id: clarity-and-specificity
model: _generic
topic: "명확성·구체성 보강 — 진단 차원과 치환 규칙"
verification: knowledge-based
rules:
  - "진단 3차원: 명확성(요청이 단일 해석인가) / 구체성(기준이 측정 가능한가) / 맥락(배경·입력·용도가 있는가)."
  - "모호어를 측정 가능한 기준으로 치환: '간결하게'→'3문장 이내', '전문적으로'→'○○ 실무자 대상 용어 수준', '좋은'→구체적 품질 기준."
  - "암묵적 기대를 명문화: 결과물로 무엇을 할 것인지(용도)를 쓰면 모델의 판단 품질이 오른다."
  - "부정 지시는 긍정형으로 재서술: '~하지 마라' 목록 대신 '~하라'."
  - "빠진 완료 기준·형식·독자는 합리적 기본값으로 채우되 가정임을 명시."
pitfalls:
  - "진단 점수만 매기고 보강 없이 넘어가는 것 — 낮은 차원은 반드시 변환에서 해소돼야 한다"
