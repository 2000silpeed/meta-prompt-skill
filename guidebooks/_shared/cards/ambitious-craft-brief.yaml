id: ambitious-craft-brief
model: _shared
topic: "탁월함 지시 — 완성도가 목표인 창작·시각화 작업을 맡기는 법"
verification: knowledge-based   # 사용자가 좋다고 고른 예시 프롬프트(팟캐스트 에피소드를 인터랙티브 해설 페이지로 만드는 지시)에서 기법을 뽑아 일반화
last_verified: "2026-10-12"
rules:
  - "무엇을 만드는지와 함께 '가장 전하고 싶은 것'을 한 문장으로 정한다. 예: 이야기 전체를 따라가되 그 안의 사업 교훈을 독자에게 전하는 데 집중."
  - "품질 기준을 형용사가 아니라 구체적 참조로 준다. 예: 'New Yorker·NYT 데이터 시각화 수준, 그보다 더 낫게'. 참조는 2~3개면 충분하고, 무엇을 본받을지(편집 디자인, 서체, 여백, 차트의 절제)를 한 줄씩 붙인다."
  - "충분한 노력을 명시적으로 허락한다: '시간과 분량을 아끼지 말고, 스스로 자랑스러울 때까지 다듬어라'. 모델은 허락이 없으면 일찍 멈춘다."
  - "반복 루프를 절차로 적는다: 만들기 → 직접 실행·렌더링·스크린샷으로 확인 → 품질 기준에 비춰 스스로 비평(무엇이 기준에 못 미치는지 구체적으로) → 고치기. 최소 반복 횟수와 멈출 조건(기준 충족 또는 N회)을 함께 준다. 멈출 조건이 없으면 끝나지 않는다."
  - "표현 수단을 제안하되 고르는 건 맡긴다: 인터랙션(스크롤 진행, 펼침, 비교 슬라이더), 일러스트, 사진, 차트. 각 수단이 핵심 메시지를 어떻게 돕는지 한 줄로."
  - "시각 자산을 만드는 구체적 방법을 알려 준다. 예: 사진·그림에 OpenCV(엣지 보존 필터 + 색 양자화 + 종이 질감)로 수채화 느낌을 입힌다. 쓸 수 있는 도구가 무엇인지(파이썬, 브라우저 렌더링)도 적는다."
  - "출처와 권리 규칙을 넣는다: 실제 사진은 퍼블릭 도메인·자유 이용 라이선스만 쓰고 출처를 표기한다. 원문(방송 대본·기사)은 길게 옮기지 말고 요약·해설하며, 직접 인용은 짧게 한두 군데만."
  - "완료 보고 형식을 정한다: 무엇을 만들었는지, 반복마다 무엇을 고쳤는지, 남은 아쉬움과 다음에 고칠 것."
template: |
  만들 것: {결과물 종류와 형식 — 예: 인터랙티브 웹 페이지 한 장}
  가장 전할 것: {핵심 메시지 한 문장}
  독자: {누가, 어디서(휴대폰·데스크톱) 보는지}
  품질 기준: {참조 2~3개 — 각각 무엇을 본받을지}. 그보다 더 낫게.
  표현 수단: {후보 — 인터랙션, 일러스트(수채화 등), 사진, 차트}. 핵심 메시지를 돕는 것만 쓴다.
  자산 만드는 법: {도구·기법 — 예: OpenCV 수채화 필터}
  권리: 사진은 자유 이용 가능한 것만 출처와 함께. 원문은 요약·해설, 직접 인용은 짧게.
  노력: 시간과 분량을 아끼지 마라. 스스로 자랑스러울 때까지 다듬어라.
  반복: 만들기 → 렌더링·스크린샷으로 확인 → 기준 대비 비평 → 고치기. 최소 {3}회, {기준 충족 또는 N회}에 멈춤.
  보고: 결과물, 반복별 개선, 남은 한계.
pitfalls:
  - "'멋지게', '고급스럽게'만 쓰고 구체적 참조·핵심 메시지가 없는 것"
  - "반복을 허락만 하고 확인 방법(렌더링·스크린샷)과 멈출 조건을 빼는 것"
  - "출처·라이선스 확인 없이 실제 사진을 쓰게 하거나 원문을 길게 옮기게 하는 것"
  - "모든 표현 수단을 다 쓰라고 해서 핵심 메시지가 흐려지는 것"
