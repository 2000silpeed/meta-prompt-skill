id: agentic-and-tools
model: alibaba-qwen
topic: "Qwen3.8 에이전트·도구 호출 프롬프트"
verification: verified   # 2026-09-03 공식 문서 대조 (도구 호출 시 reasoning_content 규칙)
rules:
  - "도구 호출 결과를 되돌려 보낼 때 해당 턴의 reasoning_content를 함께 보낸다. 빼먹으면 정확도가 떨어진다(멀티턴에서 추론 맥락이 끊긴다)."
  - "Qwen3.8-Max는 장기 자율 코딩·긴 호흡 실행을 겨냥한 모델이다. 단발 코드 조각이 아니라 '문제 확인 → 구현 → 실제 실행·검증 → 보고'까지를 한 태스크로 준다."
  - "도구는 이름만 주지 말고 목적·입력 스키마·출력 필드·오류 의미를 계약처럼 적는다. 단일 툴 한 번이면 끝나는 작업에 thinking까지 켜면 오버헤드가 이득을 넘는다."
  - "긴 컨텍스트(최대 1M)를 쓸 때는 고정 부분을 앞에, 매 요청 달라지는 부분을 뒤에 배치해 캐시 적중률을 높인다."
  - "멀티모달 입력(이미지·영상)을 쓸 땐 각 자산의 역할을 텍스트로 명시한다."
  - "완료 조건은 실행 가능한 명령으로 적는다(테스트·빌드·재현 절차). 실패·미실행 항목을 그대로 보고하게 한다."
template: |
  # Goal
  {task_goal}
  # Context
  {repository_runtime_documents_and_conventions}
  # Tools
  {tool_name}: {목적 / 입력 스키마 / 출력 필드 / 오류 동작}
  # Rules
  {승인이 필요한 행동, 금지 사항, 중단 조건}
  # Done when
  {측정 가능한 완료 조건과 검증 명령}
pitfalls:
  - "툴 결과만 보내고 reasoning_content를 생략해 멀티턴 추론이 끊기는 것"
  - "단순 단일 툴 호출에도 최대 사고량을 켜 지연을 키우는 것"
  - "검증 없이 '구현해줘'로 끝내 실행·확인 단계가 빠지는 것"
