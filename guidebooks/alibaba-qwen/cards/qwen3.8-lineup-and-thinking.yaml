id: qwen3.8-lineup-and-thinking
model: alibaba-qwen
topic: "Qwen3.8 모델 선택과 hybrid thinking 파라미터"
verification: partial   # 2026-09-03 Model Studio / QwenCloud 공식 문서 대조; 2026-11-21 qwen4-max 항목 추가 (3.8 규칙은 기존 검증일 유지)
last_verified: "2026-11-21"
rules:
  - "2026-11-16 출시된 qwen4-max(Model Studio 'Latest Model', 텍스트·이미지·영상 입력)가 현행 플래그십이다. 1M 컨텍스트, 최대 출력 131072(사고 모드 262144), 사고 포함 최대 CoT 262144. 기본값은 enable_thinking=true, preserve_thinking=true, reasoning_effort=high, thinking_budget=131072다. reasoning_effort는 low / high / xhigh를 받는다(minimal→low, medium→high, max→xhigh). 두 깊이 옵션을 함께 보내면 오류라는 규칙은 공식 문서에서 qwen3.8-max와 qwen4-max-preview에만 명시돼 있어, qwen4-max의 동시 지정 여부는 확인 불가다."
  - "qwen4-max-preview는 Token Plan 전용 미리보기 ID다. Qwen4 오픈웨이트 소형 모델은 공개 예정이라고만 공지돼 날짜와 웨이트가 확인되지 않으므로 자체 호스팅을 권하지 않는다."
  - "이전 세대 상용 라인업은 qwen3.8-max(1M 컨텍스트, 텍스트·이미지·영상 입력)와 qwen3.8-flash(저비용·저지연)다. qwen3.8-max 엔드포인트는 2026-09-05부터 스냅샷 qwen3.8-max-0902로 자동 전환됐고 가격은 바뀌지 않았다(Model Studio 업데이트 공지). 버전 고정이 필요하면 qwen3.8-max-0902 또는 alias qwen3.8-max-2026-09-02를 쓴다. 자체 호스팅은 오픈웨이트 qwen3.8-27b(hybrid), qwen3.8-2.4t-a95b(thinking 전용)를 쓴다."
  - "qwen4-max의 배포 범위는 출시 목록에서 중국 본토로, 모델 상세 페이지에서는 여러 리전으로 나와 상충한다. 리전 가용성은 콘솔에서 확인한다."
  - "상용 Qwen3.8은 hybrid thinking이며 thinking이 기본 활성이다. 끄려면 요청마다 enable_thinking=false를 준다(OpenAI SDK에서는 extra_body로 전달)."
  - "qwen3.8 계열에서 깊이 조절은 두 갈래다 — reasoning_effort(qwen3.8-max: low/medium/xhigh, 기본 xhigh) 또는 thinking_budget(qwen3.8 기준 1~32768 토큰, 기본 4000). qwen3.8-max에서는 둘을 동시에 지정하면 오류다. qwen4-max는 thinking_budget 기본 131072이며 동시 지정 여부는 확인 불가다. 하나만 골라 쓰고 프롬프트에도 어느 쪽인지 명시한다."
  - "thinking_budget에 도달하면 모델은 사고를 멈추고 즉시 답을 쓴다. 답변 품질이 끊기면 예산을 올리기 전에 reasoning_effort로 바꿔 보는 편이 단순하다."
  - "추론은 reasoning_content, 최종 답은 content 필드로 분리돼 온다. 사용자에게 보여줄 텍스트는 content만 쓴다."
  - "일부 모델(특히 오픈웨이트 계열)은 스트리밍 전용이라 비스트리밍 호출이 오류다. 긴 추론에서는 타임아웃 방지를 위해서도 스트리밍을 기본으로 둔다."
  - "오픈웨이트 모델은 프롬프트 끝에 /think · /no_think를 붙여 턴 단위로 사고를 켜고 끌 수 있다. 모델은 가장 최근 지시를 따른다."
  - "복잡한 논리·수학·다단계 계획은 thinking을 켜고, 잡담·단순 QA·형식 변환은 꺼서 지연과 비용을 줄인다."
template: |
  {프롬프트 본문 — 목표 / 맥락 / 제약 / 출력 형식}

  # API 권고
  model: {qwen4-max | qwen3.8-max | qwen3.8-flash}
  enable_thinking: {true(기본) | false}
  # qwen4-max
  reasoning_effort: {low | high(기본) | xhigh}
  # qwen3.8-max
  reasoning_effort: {low | medium | xhigh(기본)}   # thinking_budget과 동시 지정 금지
  stream: true
pitfalls:
  - "reasoning_effort와 thinking_budget을 함께 보내 오류를 맞는 것"
  - "reasoning_content를 최종 답으로 착각해 사용자에게 노출하는 것"
  - "스트리밍 전용 모델을 비스트리밍으로 호출하는 것"
  - "단순 반복 작업에도 기본 reasoning_effort(qwen4-max는 high, qwen3.8-max는 xhigh)를 그대로 두어 비용·지연을 키우는 것"
