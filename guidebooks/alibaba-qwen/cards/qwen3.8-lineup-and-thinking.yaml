id: qwen3.8-lineup-and-thinking
model: alibaba-qwen
topic: "Qwen3.8 모델 선택과 hybrid thinking 파라미터"
verification: verified   # 2026-09-03 Model Studio / QwenCloud 공식 문서 대조
rules:
  - "상용 라인업은 qwen3.8-max(플래그십, 1M 컨텍스트, 텍스트·이미지·영상 입력)와 qwen3.8-flash(저비용·저지연)다. 자체 호스팅은 오픈웨이트 qwen3.8-27b(hybrid), qwen3.8-2.4t-a95b(thinking 전용)를 쓴다. 스냅샷 고정이 필요하면 qwen3.8-max-0902처럼 날짜 스냅샷을 지정한다."
  - "상용 Qwen3.8은 hybrid thinking이며 thinking이 기본 활성이다. 끄려면 요청마다 enable_thinking=false를 준다(OpenAI SDK에서는 extra_body로 전달)."
  - "깊이 조절은 두 갈래다 — reasoning_effort(qwen3.8-max: low/medium/xhigh, 기본 xhigh) 또는 thinking_budget(1~32768 토큰, 기본 4000). 둘을 동시에 지정하면 오류다. 하나만 골라 쓰고 프롬프트에도 어느 쪽인지 명시한다."
  - "thinking_budget에 도달하면 모델은 사고를 멈추고 즉시 답을 쓴다. 답변 품질이 끊기면 예산을 올리기 전에 reasoning_effort로 바꿔 보는 편이 단순하다."
  - "추론은 reasoning_content, 최종 답은 content 필드로 분리돼 온다. 사용자에게 보여줄 텍스트는 content만 쓴다."
  - "일부 모델(특히 오픈웨이트 계열)은 스트리밍 전용이라 비스트리밍 호출이 오류다. 긴 추론에서는 타임아웃 방지를 위해서도 스트리밍을 기본으로 둔다."
  - "오픈웨이트 모델은 프롬프트 끝에 /think · /no_think를 붙여 턴 단위로 사고를 켜고 끌 수 있다. 모델은 가장 최근 지시를 따른다."
  - "복잡한 논리·수학·다단계 계획은 thinking을 켜고, 잡담·단순 QA·형식 변환은 꺼서 지연과 비용을 줄인다."
template: |
  {프롬프트 본문 — 목표 / 맥락 / 제약 / 출력 형식}

  # API 권고
  model: {qwen3.8-max | qwen3.8-flash}
  enable_thinking: {true(기본) | false}
  reasoning_effort: {low | medium | xhigh}   # thinking_budget과 동시 지정 금지
  stream: true
pitfalls:
  - "reasoning_effort와 thinking_budget을 함께 보내 오류를 맞는 것"
  - "reasoning_content를 최종 답으로 착각해 사용자에게 노출하는 것"
  - "스트리밍 전용 모델을 비스트리밍으로 호출하는 것"
  - "단순 반복 작업에도 기본 xhigh를 그대로 두어 비용·지연을 키우는 것"
