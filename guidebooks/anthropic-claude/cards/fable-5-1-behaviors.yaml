id: fable-5-1-behaviors
model: anthropic-claude
topic: "Fable 5.1에서 달라진 기본 동작과 프롬프트 처방"
verification: verified   # 2026-09-03 공식 문서 대조 (prompting-claude-fable-5-1)
rules:
  - "Fable 5용 프롬프트는 대체로 그대로 잘 동작한다. 아래는 관찰된 증상이 있을 때만 골라 넣는 처방이지, 기본 탑재할 규칙 묶음이 아니다."
  - "툴 호출이 턴당 하나씩 나가면(커스텀 코딩 에이전트, bash+editor 하네스, computer use) 배칭 한 줄을 붙인다: 'First privately list what you need next; then request every item that doesn't depend on another's result in this one response.'"
  - "긴 툴 체인에서 사용자 쪽이 조용해 보이면 ①클라이언트가 progress update를 받고 있는지(display: updates/summarized) 확인하고 ②'최종 응답까지 발견을 보류하라'류의 낡은 지시를 제거한 뒤 ③시작 한 줄·중간 업데이트·독립적으로 읽히는 마무리 요약을 요구한다."
  - "문장이 빽빽해지면 과장된 비유체(mannered prose)를 안티패턴으로 정의해 금지한다. 짧은 버전 'Please remove all mannered prose.'도 대체로 통한다."
  - "Fable 5.1은 볼드·헤더·리스트를 오히려 덜 쓴다. 이전 모델용 반(反)서식 규칙이 남아 있으면 제거하고, '내용이 다면적일 때는 리스트를 쓰라'처럼 서식이 적절한 조건을 적는다."
  - "문서 요약에서 원문 구절을 인용 표시 없이 옮기는 경향이 있다. 올바른 응답 1개(요청+응답+왜 옳은지)를 시스템 프롬프트에 예시로 넣는다."
  - "긴 작업을 끝까지 시키려면 '자율 실행 중이며 사용자는 실시간으로 보고 있지 않다'는 문장으로 시작하는 블록과, 요청 범위=산출물임을 정의하는 블록을 함께 넣는다. 마지막 문단이 계획·질문·약속이면 지금 실행하라는 지시가 핵심이다."
  - "요청 범위를 넘는 정리·리팩터링·테스트 파일 추가가 잦으면, 발견한 기존 버그는 후속 항목으로 보고만 하고 이번 변경에 넣지 말 것, 테스트는 태스크가 요구하거나 저장소 관례가 있을 때만 이웃 파일 크기로 커밋할 것을 명시한다."
  - "low effort에서는 검색·검색툴 호출이 줄고 기억에 의존한다. 해당 턴만 effort를 올리거나, '빠르게 변하는 영역의 이름은 사용자가 쓴 표기 그대로 검색해 확인하라'는 지시를 넣는다."
  - "작은 수정에도 파일 전체를 재작성하면 'when it will not affect the end result, try to surgically edit a file rather than rewrite the entire thing'을 붙인다."
  - "xhigh/max에서 긴 산출물을 요구하면 사고에서 초안을 다 쓰고 다시 출력해 시간과 토큰이 두 배가 될 수 있다. 기본은 high로 돌리고, 굳이 쓴다면 max_tokens를 사고+응답 몫으로 잡고 '한 번의 응답이 약 [max_tokens] 토큰 한도를 공유한다'는 안내를 사용자 메시지 끝에 붙인다."
  - "서브에이전트는 자주 쓰되 리드가 결과를 기다리며 멈추지 않게 한다 — 시작 툴은 즉시 반환하고, 결과는 이후 user 메시지로 전달하며, 기다리고 싶을 때 쓰는 별도 대기 툴을 준다."
  - "밀도 높은 차트·스크린샷 등 시각 작업은 crop/zoom 도구(또는 PIL·OpenCV가 깔린 컨테이너)를 함께 주면 성능이 크게 오른다."
  - "안전장치 오탐을 줄이려면 '이 프로그램이 오류 없이 컴파일되나?' 대신 '이 프로그램에 버그가 있나?'로 묻고, 비주류 언어는 문서를 함께 주며, 툴 출력의 base64 데이터는 제거한다."
template: |
  (증상 → 처방 매핑. 해당하는 것만 시스템 프롬프트/사용자 메시지에 추가)
  - 턴당 툴 1개        → 배칭 한 줄
  - 진행 상황 침묵     → display: updates + 업데이트 요구 문장
  - 문장이 빽빽함      → mannered prose 금지
  - 서식 부족          → 서식이 적절한 조건 명시
  - 무표시 인용        → 올바른 응답 예시 1개
  - 중도 중단·허가 요청 → 자율 실행 블록 + 범위=산출물 블록
  - 요청 밖 변경       → 부수 변경 금지 + 테스트 범위 규칙
  - 전체 재작성        → 국소 편집 지시
pitfalls:
  - "증상도 없는데 이 처방을 전부 붙여 프롬프트를 부풀리는 것 — Fable 5.1은 과잉 규정에 성능이 떨어진다"
  - "이전 모델용 반서식·narration 억제 규칙을 그대로 둔 채 '업데이트가 없다'고 진단하는 것"
  - "effort를 올리는 것으로 모든 품질 문제를 해결하려는 것 (긴 산출물은 오히려 high가 낫다)"
