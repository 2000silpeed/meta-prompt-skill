id: fable-5-2-behaviors
model: anthropic-claude
topic: "Fable 5.2에서 달라진 기본 동작과 프롬프트 처방"
verification: verified   # 2026-11-09 공식 문서 대조 (prompting-claude-fable-5-2, whats-new-fable-5-2)
last_verified: "2026-11-09"
rules:
  - "아래는 관찰된 증상이 있을 때만 하나씩 넣는 처방이다. 넣을 때마다 자체 과제에서 효과와 토큰 비용을 측정한다. 공식 문서의 수치는 Anthropic 내부 테스트 결과이며 사용자의 과제에서 같은 폭을 보장하지 않는다."
  - "시스템 프롬프트·스킬·도구 설명을 고치는 처방은 새 대화부터 적용한다. 5.2는 모든 계정에 prefix check를 강제하므로 저장된 대화를 바뀐 지시로 재개하면 400이 날 수 있다. 대화 중에는 최신 턴에 넣거나 mid-conversation system message로 덧붙인다."
  - "effort: high(기본)에서 시작해 medium·xhigh도 eval로 비교한다. high 이상에서는 인사에도 사고한 뒤 답하므로, 쉬운 요청이 느리거나 비싸면 문구가 아니라 해당 턴의 effort를 낮춘다. effort는 답변 길이를 거의 바꾸지 않으므로 길이·어조는 프롬프트로 조절한다. 계획·반복은 medium, 긴 무인 구간만 올리는 혼합도 가능하다."
  - "긴 다단계 작업에서 남은 일 목록·계속할지 묻는 제안·평범한 장애물(타임아웃 등)에서 턴을 끝내는 일이 있고 low·medium에서 더 잦다. 이때 template의 'Finishing work' 블록을 시스템 프롬프트에 넣는다. 핵심은 평범한 장애물(오류·타임아웃·실패한 툴)은 진단해 넘어가고, 의도된 차단(손대지 말라고 표시된 파일, 일부러 막은 접근, 안전 장치)은 건드리지 않고 보고하게 하는 구분이다. 출력 토큰이 늘고 모델이 덜 묻게 되므로 위험·비가역 행동의 확인 단계는 하네스에 따로 둔다."
  - "계속 진행시킬 때 'go'나 엄지 대신 원하는 행동을 문장으로 준다(예: 'Yes, run the migration on the staging database'). 승인 규칙은 쓰인 그대로 적용되므로 대상 행동을 정확히 지목한다 — '대화 밖 사람에게 메시지 보내기'처럼 넓게 쓰면 동료·타 팀에 대한 일상 요청까지 보류한다."
  - "코드 소유권 문구에 민감하다. 소유자를 말하지 않거나 남의 코드로 제시하면 기존 구조에 덧붙이고(중복 코드 포함) 주변 문제는 고치지 않고 보고만 한다. 구조 개선까지 원할 때만 소유권 문장을 넣는다: 'This codebase is yours: what it's for and how it's built are your call, and you'll keep building on it.' 이 문장은 출력 토큰과 요청 밖 변경(테스트·문서 추가, 드물게 기존 동작 변경)을 늘리고 마무리 요약이 작은 변경을 빠뜨리므로 diff를 검토한다. 사용자의 코드를 최소한으로만 바꿔야 하면 넣지 않는다 — 다른 곳의 범위 제한 규칙이 이 문장을 상쇄하지 못한다."
  - "긴 툴 체인에서 조용해 보이면 먼저 클라이언트가 progress-update thinking 블록을 받는지 확인한다(display: updates 또는 summarized). 그래도 부족하면 ①하네스가 읽을거리 없는 연속 툴 단계를 세다가 turn-scoped system message로 'The user hasn't heard from you in a while: say in a few words what you're doing, then continue.'를 붙이고(붙인 리마인더는 이후에도 그대로 둔다) ②시작 한 줄·중간 업데이트·독립적으로 읽히는 마무리를 요구하는 template의 'Updates' 문장을 넣는다. 하네스를 못 고치면 'Every few tool calls, give the user a one-line update on where things stand.' 한 문장을 쓴다. 사람이 실시간으로 지켜볼 때만 필요하며 비동기 장기 작업에서는 공백이 덜 중요하다."
  - "서브에이전트 위임량은 하네스와 과제에 좌우된다. 위임을 권하는 프롬프트에서는 쉽게 위임하고 xhigh·max에서는 자기 작업 검토에도 서브에이전트를 쓴다. 과하면 먼저 시스템 프롬프트·스킬·에이전트 파일의 상시 위임 지시를 줄이고, 그래도 많을 때만 서브에이전트 시작 도구의 설명을 고친다 — 비용을 먼저 말하고, 위임이 값진 경우와 아닌 경우, 브리핑 방법을 적는다. 너무 적게 위임하면 비용 서술을 줄인다. 서브에이전트가 기본으로 어느 모델에서 도는지 확인한다."
  - "조심하라는 지시는 메모리·노트·지시 파일·에이전트 간 메시지에 쌓이고 5.2는 이를 엄격히 따른다. 불필요한 승인 요청이나 일상 작업 보류가 보이면 ①이유가 사라진 노트를 지우고 ②승인이 필요 없는 단계를 이름으로 나열하며(일반적인 '더 자유롭게 행동하라'는 효과가 없다; 재시도는 반복해도 안전한 호출에만) ③리뷰어 에이전트가 붙이는 조건('stop at the first error' 등)을 점검하고 ④'never' 규칙에는 예외를 별도 줄이 아니라 규칙 문장 안에 쓴다('먼저 승인을 받고 진행')."
  - "이전 모델용 지시를 이전 전에 걸러낸다 — 상시 위임 지시, 하네스가 프롬프트에 적는 토큰 예산 문구(큰 예산은 지출을 늘린다), 이전 턴을 편집하는 하네스 코드, Opus 5.5용 '그 답은 끝난 것으로 보라' 채팅 문장(후속 질문의 사고는 줄지만 자기 답의 오류 지적도 크게 준다), '숙고 없이 바로 답하라'류(medium 이상에서 무효 — 지우고 effort를 낮춘다), 문장 길이 상한 같은 강한 문체 규칙(문장이 끊긴다), 누적된 주의 규칙·메모."
  - "긴 에이전트 작업의 최종 보고·인계문은 툴 호출과 파일을 보지 못한 독자가 읽는다. 보고 품질이 문제면 template의 'Communicating clearly' 블록을 시스템 프롬프트에 넣고 독자·제품에 맞게 고친다. 길이나 포함할 세부는 따로 지시한다. 남아 있는 강한 문체 규칙을 먼저 지운 뒤 넣는다."
  - "거절(stop_reason: refusal)은 stop_details.category로 구분한다. 정상적인 보안·생명과학 작업도 cyber/bio 분류기에 걸릴 수 있으며, 조직 업무가 막히면 Cyber / Life Sciences Verification Program과 Claude Mythos 5.2를 안내한다. 응답에 추론을 적게 하는 지시는 프롬프트·스킬·도구 설명에서 제거한다."
template: |
  (증상 → 처방. 해당하는 것만, 하나씩, 새 대화의 시스템 프롬프트에 추가)
  - 쉬운 요청이 느림·비쌈   → 해당 턴 effort 하향 ('바로 답하라' 문구는 제거)
  - 작업 도중 턴 종료       → Finishing work 블록
  - 불필요한 승인 대기      → 승인 규칙의 대상 행동 명시 + 승인 불필요 단계 나열 + 낡은 주의 노트 삭제
  - 중복 코드·보고만 함     → 소유권 문장 (최소 변경이 목표면 넣지 않음)
  - 진행 상황 침묵          → display: updates → 하네스 리마인더 → Updates 문장
  - 서브에이전트 과다       → 상시 위임 지시 삭제 → 시작 도구 설명에 비용·기준·브리핑
  - 보고가 빽빽함           → Communicating clearly 블록

  [Finishing work]
  # Finishing work
  Please avoid stopping while you still owe work the user asked for. Be persistent and do not stop unless needed.

  While status notes are welcome, as is clarifying with the user on open decisions, carry on with work that does not depend on the user's answer without unnecessary stops.

  If you notice yourself inviting the user to redirect you or offering to wait, instead proceed on the next part of the task. You may meet ordinary obstacles like errors, timeouts, locked files, empty results or failing tools. Diagnose them first, and when they are not real blockers, work through them with the access you have (wait and retry, fix the request, use another tool or source) rather than stopping unnecessarily.

  If someone clearly decided something is a hard blocker, such as a file marked not to be touched, access that was intentionally withheld, or a safety guardrail, leave it alone, say plainly what you found, and look for another safe way to finish the task. Stopping before the task is complete is very rarely merited, as in when the task can't move forward without user input, or where the blocker is deliberate and should not be worked past. This does not override the need for confirmation on risky or destructive actions.

  [Updates]
  Before you start, say in a line what you're about to do; brief updates while you work help the user follow along. Close with a short recap that stands on its own (what you found, what you did, and what's next), so a reader who only sees the last message has the full picture.

  [Communicating clearly]
  # Communicating clearly
  Write for an intelligent but low-context reader. The person reading has not seen your tool calls, your reasoning or the files you opened, and may be switching in from other work. Messages should generally be self-contained: the reader should understand what you mean without having to dig for other context. Put the key points in the first few sentences. Practice progressive disclosure in your sentence order, and do not use undefined references and ideas in line 1 that won't make sense until the reader reaches line 12.

  Use plain words, and write in clear, understandable full sentences. Do not use a term or abbreviation that you made up during the work. Say what the thing is in a way any reader would understand. Write mostly in the style of ASD-STE100 Simplified Technical English: short sentences, one idea per sentence, active voice, and consistently using the same word for the same thing. Use a paragraph of flowing prose where ideas connect, and keep bullets for lists of separate items. Leave out unnecessary details unless the reader asks and practice concision, but do ensure that your messages have the key context. Aim to make your user-facing text as human-readable and clear as possible.
pitfalls:
  - "증상도 없는데 이 처방을 전부 붙이는 것 — 처방마다 출력 토큰이 늘고(공식 테스트에서 처방에 따라 약 20%~1.5배) 5.2는 쌓인 지시를 엄격히 따른다"
  - "Fable 5.1용 처방 카드(fable-5-1-behaviors)를 5.2에 그대로 옮기는 것 — 5.2에서 같은 증상을 확인한 뒤 이 카드의 처방을 쓴다"
  - "소유권 문장을 넣고 마무리 요약만 믿는 것, 또는 범위 제한 규칙으로 상쇄될 것이라 기대하는 것"
  - "진행 침묵을 프롬프트 문제로만 보고 display 설정과 클라이언트 렌더링을 확인하지 않는 것"
  - "Finishing work 블록을 넣으면서 위험·비가역 행동의 확인 단계를 없애는 것"
  - "저장된 대화의 시스템 프롬프트를 고쳐 재개해 prefix check 400을 맞는 것"
