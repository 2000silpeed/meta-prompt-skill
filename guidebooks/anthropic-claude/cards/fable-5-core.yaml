  {measurable_completion_and_verification_criteria}
  </done_when>

  충분한 정보가 있으면 끝까지 수행하라. 진행·완료 주장은 실제 도구 결과로 검증하고, 최종 답은 결과부터 명확한 문장으로 보고하라.
pitfalls:
  - "이전 Claude용 장황한 행동 규칙을 그대로 누적해 Fable 5의 기본 성능을 떨어뜨리는 것"
  - "단순 작업에 high/xhigh를 고정해 과도한 조사·계획·정리를 유발하는 것"
  - "이미 승인된 가역적 범위 내 작업마다 다시 허가를 묻게 하는 것"
