id: fable-5-runtime
model: anthropic-claude
topic: "Claude Fable 5.2 런타임 — 모델 ID, effort, thinking 블록 바인딩, breaking change, refusal (5.1 차이 포함)"
verification: verified   # 2026-11-09 공식 모델 개요·Fable 5.2 개요·what's new·마이그레이션 가이드 대조
last_verified: "2026-11-09"
rules:
  - "최신 Fable은 Claude Fable 5.2(2026-11-09 출시)다. API 모델 ID는 claude-fable-5-2(Bedrock은 anthropic.claude-fable-5-2), 검증 프로그램 승인 조직 전용판은 claude-mythos-5-2다. 컨텍스트 1M, 최대 출력 128K, adaptive thinking 상시 on. 버전 없는 Fable 요청은 5.2로 해석하고, 사용자가 명시한 claude-fable-5-1(레거시, 계속 제공)은 유지한다."
  - "대부분의 워크로드는 Claude Opus 5.5로 시작하고, 고난도 추론·장기 에이전트 작업이거나 Opus를 높은 effort로 올려도 eval이 부족할 때 Fable 5.2를 쓴다. 가격은 입력 $8 / 출력 $40 per MTok(5.1은 $10/$50), cache read는 기본 입력가의 0.025배, Batch는 50% 할인이다."
  - "effort가 사고 깊이·지연·비용의 주 조절값이며 low/medium/high/xhigh/max를 지원한다. API 기본은 high이고 역량 이득의 대부분이 high에서 이미 나온다. low는 빠른 왕복·명세가 분명한 작업·대량 서브에이전트, medium은 대화형 코딩·채팅·일상 지식 작업, high는 어려운 코딩·리서치·무인 장기 실행, xhigh는 이득을 측정한 최고난도 장기 작업, max는 한계 측정이나 시간·토큰이 문제되지 않는 드문 과제에 쓴다. effort 이름이 모델 간 같은 사고량을 뜻하지 않으므로 5.1·Opus 5.5에서 튜닝한 값을 옮기지 말고 스윕을 다시 돌린다."
  - "5.1에서 옮길 때 코드를 깨뜨릴 수 있는 변경은 4건이다 — ①prefix check가 계정 생성일과 무관하게 모든 계정에 적용된다(5.1은 2026-08-31 이후 생성 계정만 기본 적용) ②5.2의 thinking 블록은 Fable 5.2·Mythos 5.2만 읽는다 ③구형 computer_20251124 도구는 Bedrock을 제외한 모든 플랫폼에서 400이므로 computer_toolset_20260801을 선언한다 ④advisor tool(beta)에서 5.2 executor의 advisor는 Fable 5.2 또는 Mythos 5.2만 허용된다."
  - "prefix check: thinking 블록이 만들어진 뒤 system·tools·이전 메시지 중 하나라도 바뀐 채 그 블록을 되돌려 보내면 400('The block is bound to a different conversation')이다. 히스토리는 append-only로 다루고 assistant 턴은 받은 블록 그대로·같은 순서로 재전송한다. Claude Code·claude.ai·Managed Agents·Agent SDK가 요청을 조립하면 영향이 없다. 임시 우회는 beta 헤더 thinking-binding-controls-2026-08-01과 thinking.block_binding.prefix_mismatch_behavior: drop_block이며, 재사고로 출력 토큰이 늘 수 있어 상시 설정으로 두지 않는다."
  - "히스토리를 고치지 않고 바꾸는 수단을 쓴다 — 턴별 리마인더는 turn-scoped system message(clear_at: next_user_message, beta mid-conversation-system-clear-at-2026-08-21), 도구 추가·제거는 mid-conversation tool changes(beta inline-tools-2026-09-15), 이력 축약은 compaction on demand(beta compact-2026-09-04)나 context editing. 넣은 리마인더를 이후 요청에서 지우거나 고쳐 쓰는 것도 편집이다. 시스템 프롬프트·도구 설명 변경은 새 대화부터 적용한다."
  - "모델 전환: 5.2는 Opus 5.5·Sonnet 5.5·Haiku 5.5·Fable 5.1·Opus 5 등 이전 모델의 thinking 블록을 읽지만(Claude API·Google Cloud Google managed), 5.2에서 다른 모델로 넘어가면(Opus 5.5·Fable 5.1·fallback 모델 포함) 5.2의 블록은 API가 조용히 버린다. 요청은 성공하고 과금되지 않으나 전환 직후 턴의 비용·지연이 오른다. thinking 블록은 생성한 계정(또는 연결된 계정)에서만 유효하다."
  - "adaptive thinking은 끌 수 없다. thinking: enabled+budget_tokens와 disabled는 400이므로 thinking은 생략하거나 {type: adaptive}만 보낸다. forced tool use(tool_choice any/tool)도 400이다 — tool_choice: auto + strict tool use 또는 JSON outputs로 대체하고 '어떤 상황에 이 툴을 쓰라'를 프롬프트에 적는다. temperature/top_p/top_k는 생략한다. 이 항목들은 5.1과 같다. 단 CMEK 조직에서는 structured outputs(strict·JSON outputs)를 쓸 수 없어 코드로 검증한다."
  - "thinking.display 기본은 omitted라 툴 호출 사이의 progress-update thinking 블록 본문이 비어 온다. 진행 상황을 보여주려면 display: updates(beta thinking-display-updates-2026-08-18) 또는 summarized로 받고, 텍스트가 있는 thinking 블록을 렌더링한다. 원시 사고 과정은 반환되지 않는다."
  - "per-message effort(beta mid-conversation-output-config-2026-07-01)로 대화 중 단계별 effort를 바꾸면 프롬프트 캐시가 유지된다. 지원되지 않는 플랫폼에서 최상위 effort를 바꾸면 캐시가 새로 시작된다."
  - "thinking 토큰도 max_tokens에 포함된다. '숙고 없이 바로 답하라'는 문구는 5.2에서 medium 이상의 사고를 막지 못하므로, 작은 max_tokens에 맞춰 둔 요청은 thinking 뒤 텍스트 없이 stop_reason: max_tokens로 끝날 수 있다. max_tokens를 키우거나 effort를 낮춘다."
  - "안전 분류기가 거절하면 HTTP 200에 stop_reason: refusal과 stop_details.category(cyber / bio / frontier_llm / reasoning_extraction / general_harms)가 온다. 모든 범주를 처리한다. 서버측 fallback(beta server-side-fallback-2026-07-01, fallbacks: default)이나 자체 재시도를 쓰되, 5.2의 허용 fallback 대상은 Claude Opus 4.8과 Claude Opus 5뿐이고 reasoning_extraction은 재시도되지 않는다."
  - "'추론 과정을 응답에 그대로 옮겨 적으라'는 지시는 reasoning_extraction 거절을 유발한다. 사고 가시성이 필요하면 display: summarized로 thinking 블록을 읽는다."
  - "운영 조건: 30일 데이터 보존이 필수이며 ZDR에서는 Anthropic의 명시적 승인 없이는 400이다. rate limit은 5.1·Opus 5.5와 별도다. fast mode(speed: fast, Claude API 기준 입력 $16 / 출력 $80)는 지원 플랫폼에서만 쓰고 Managed Agents에서는 제거하며, Microsoft Foundry는 별도 배포 claude-fable-5-2-fast를 쓴다."
template: |
  API 권고:
  - model: claude-fable-5-2   (검증 조직 전용: claude-mythos-5-2 / 명시된 구버전: claude-fable-5-1)
  - effort: {high(기본) | low | medium | xhigh | max}   # 명시적으로 지정하고 자체 eval로 스윕
  - thinking: 생략 또는 {type: adaptive, display: omitted | updates(beta) | summarized}
  - tool_choice: auto  (any/tool 금지 — strict tool use / JSON outputs)
  - 히스토리: append-only. 리마인더는 turn-scoped system message, 도구 변경은 mid-conversation tool changes
  - computer use: computer_toolset_20260801  (Bedrock만 computer_20251124 허용)
  - stop_reason == refusal → stop_details.category 처리, fallback: {Claude Opus 4.8 | Claude Opus 5}
pitfalls:
  - "오래된 계정에서 5.1로 문제없던 히스토리 편집 코드를 그대로 5.2에 옮겨 400을 맞는 것"
  - "라우터·fallback이 5.2 대화를 Opus 5.5나 Fable 5.1로 넘길 때 5.2의 추론이 이어진다고 가정하는 것"
  - "fallback 대상을 Claude Opus 5.5로 지정하는 것 — 5.2의 허용 대상은 Opus 4.8·Opus 5다"
  - "'바로 답하라' 문구로 사고를 줄이려 하는 것 — 5.2에서는 effort를 낮춰야 한다"
  - "tool_choice any/tool, 비기본 sampling 값, 구형 computer_20251124, 5.1 advisor를 그대로 이전하는 것"
  - "refusal을 정상 완료나 빈 응답으로 오인하거나, 장시간 실행을 동기 요청 타임아웃으로 처리하는 것"
