model: anthropic-claude
label: "Anthropic Claude / Opus 5.5 · Sonnet 5.5 · Haiku 5.5 · Fable 5.2"
output_language: follow-target

slots:
  required:
    - id: task_goal
      ask: "이 프롬프트로 모델이 정확히 무엇을 해내야 하나요?"
  optional:
    - id: model_variant
      default: "claude-opus-5-5"
      note: "대부분의 워크로드는 Opus 5.5부터 시작하고, 고난도 추론·장기 에이전트 작업에서 eval이 부족하면 Fable 5.2(claude-fable-5-2)를 쓴다. 버전 없는 Fable은 5.2, 명시한 5.1은 유지"
    - id: effort
      default: "medium"
      note: "Opus 5.5 기본은 medium, Sonnet 5.5 기본은 high. 역량 최우선은 high/xhigh/max, 일상 작업은 low. Fable(5.2/5.1)을 명시하면 기본 high"
    - id: deployment
      default: "단발 대화형 호출"
      note: "시스템 프롬프트용 / 에이전트 루프용 / 단발 호출용"
    - id: input_description
      default: "사용자 요청에서 추론"
      note: "긴 문서가 입력되는지가 특히 중요 (long-context 카드 분기)"
    - id: output_format
      default: "자유 산문"
    - id: examples_available
      default: "없음"
      note: "좋은 출력 예시가 있으면 품질이 크게 오름"

cards:
  - id: opus-5-5-runtime
    when: "타깃이 Claude Opus 5.5이거나 버전 없는 Claude/Opus 요청일 때"
  - id: sonnet-haiku-5-5-runtime
    when: "타깃이 Claude Sonnet/Haiku 5.5이거나 버전 없는 Sonnet/Haiku 요청일 때. 버전 없는 Sonnet/Haiku는 각 5.5 모델로 해석하고 명시한 구버전은 유지"
  - id: fable-5-core
    when: "타깃이 Claude Fable(5 / 5.1 / 5.2)이고 장시간 자율 작업을 맡길 때"
  - id: fable-5-2-behaviors
    when: "타깃이 Fable 5.2(또는 버전 없는 Fable)이고 관찰된 증상(중도 종료, 불필요한 승인 대기, 진행 침묵, 서브에이전트 과다, 중복 코드, 빽빽한 보고)을 교정하거나 이전 모델용 프롬프트를 옮길 때"
  - id: fable-5-1-behaviors
    when: "타깃이 Fable 5.1로 명시됐고 그 관찰된 증상(툴 배칭, 진행 표시, 문체·서식, 중도 중단, 범위 초과, 전체 재작성 등)을 교정해야 할 때"
  - id: fable-5-runtime
    when: "Fable 5.2(또는 명시한 5.1) API 통합·마이그레이션·effort/thinking 설정·모델 전환·거부 처리가 필요할 때"
  - id: explicit-instructions
    when: "항상 로드 (모든 Claude 변환의 기본)"
  - id: xml-structure
    when: "입력에 문서/데이터/코드 등 구분해야 할 블록이 있거나 긴 컨텍스트일 때"
  - id: multishot-examples
    when: "출력 형식·스타일의 일관성이 중요하거나 예시 확보가 가능할 때"
  - id: thinking-and-cot
    when: "다단계 추론, 분석, 판단 또는 thinking/effort 설정이 필요한 작업일 때"
  - id: system-role-tools
    when: "시스템 프롬프트 설계 또는 에이전트/툴 사용 프롬프트일 때"
