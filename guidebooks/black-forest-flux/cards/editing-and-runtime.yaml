id: editing-and-runtime
model: black-forest-flux
topic: "참조 역할·버전별 편집 동작·플랫폼과 직접 API 경계"
verification: partial
last_verified: "2026-11-21"
note: "11-21 재확인 범위: FLUX 3 Image API 레퍼런스, 바운딩 박스 문서, 릴리스 노트(10/15 Klein, 10/22 크기·match_input), Klein API 레퍼런스. FLUX.2 편집·다중 참조·prompt_upsampling 규칙은 10/27 근거를 유지하며 이번에 다시 열지 않았다."
rules:
  - "참조 이미지가 있으면 전달 순서에 맞춰 image 1, image 2 등으로 부르고 각각 편집 대상/인물/제품/의상/배경/스타일 중 역할을 지정한다. 대상 버전이 이미지 순번 참조를 지원하는지 확인한다."
  - "바꿀 항목과 보존할 항목을 구분해 적는다. 보존 요청은 목표이지 픽셀 단위 불변 보장이 아니며, 결과에서 직접 비교한다."
  - "FLUX.2 [pro]/[max] 가이드의 multi-reference 및 prompt_upsampling 설명은 해당 FLUX.2 모델과 이를 노출한 경로에 한정한다. prompt upsampling은 문장을 자동 확장·보강할 수 있으므로 정확한 문구, 최소 변경, 재현성이 중요한 작업에서는 실제 설정 노출 여부와 적용 결과를 확인하고 의도 변형 가능성을 알린다."
  - "FLUX 3 Image는 현재 별도 API 문서와 프롬프팅 페이지를 따른다. 해당 문서는 reference 이미지들의 역할·순서 지정과 최대 10개 입력을 다루며, prompt_upsampling 기능이 있다고 추정하지 않는다."
  - "FLUX 3 Image API(POST /v1/flux-3-image) 실행 설정: width·height(각 256~6256, 둘 다 지정), resolution(768sq/1k/1.5k/2k/4k/match_input, 기본 1k), aspect_ratio(기본 auto). width·height는 resolution과 aspect_ratio를 덮어쓴다. match_input은 편집에서만 쓰며 첫 참조 이미지 크기에 맞춘다. 참조가 있으면 최대 4MP(4194304px), 신규 생성은 최대 약 16.8MP다(2026-10-22 공지). 이 설정은 프롬프트 본문과 분리해 적는다."
  - "FLUX 3 Image의 grounding 파라미터는 기본 true이며 웹·이미지 검색으로 실제 사물·장소를 보강할 수 있다. 허구 장면을 원하면 grounding=false를 명시하는 것을 설정 항목으로 제안하되, 실행 경로가 이 필드를 노출할 때만 적는다. 변경 시점은 공식 공지에서 확인하지 못했다."
  - "FLUX 3 Image 바운딩 박스는 별도 필드가 없고, 프롬프트 뒤에 JSON 행 배열로 붙인다. 각 박스는 [top, left, bottom, right]의 0~1000 정수 격자(좌상단 기준)이며, 생성 행은 id·bbox·desc, 편집 행은 id·from·src_bbox·tgt_bbox·desc를 쓴다. 박스 크기가 지나치게 작으면 요소가 나타나지 않을 수 있고, 박스는 클리핑 마스크가 아니다. 박스 안에 넣을 글자는 별도 박스와 desc에 원문으로 적는다."
  - "FLUX 3 Image Klein(POST /v1/flux-3-image-klein, 2026-10-15 공개)은 Hugging Face 가중치(flux-3-image-klein: Distilled 16 steps CFG 1 / flux-3-image-klein-base: Base 50 steps CFG 3.5)가 있는 별도 모델이다. 공식 API 레퍼런스 기준 steps(1~16, 기본 16)·seed·output_format(jpeg/png)을 받고 grounding과 match_input은 받지 않으며, width·height 최소값은 64다. 릴리스 노트는 FLUX 3 Image와 같은 요청 형식이라고 하나 레퍼런스 스키마와 다르므로 실행 직전에 해당 endpoint 스키마를 확인한다. 참조는 최대 10개다."
  - "대상 사용 경로가 명시되면 우선한다. BFL 직접 API 파라미터, Playground/외부 플랫폼의 UI 옵션, Codex 내장 도구 스키마는 서로 대체 근거가 아니다. 실제 노출된 입력과 버전을 확인하고, 확인 불가면 프롬프트 작성까지만 한다."
  - "현재 런타임에서 FLUX를 실행할 수 있다고 가정하거나, API 호출·생성·비용 발생을 완료했다고 말하지 않는다. 생성 도구가 없거나 권한·비용 조건이 불명확하면 텍스트 산출물과 실행 경계를 구분해 보고한다."
  - "공식 문서가 말하는 지원 기능과 자체 권장 검증을 구별한다. 입력 허용은 품질 증거가 아니며, 문자 정확성·색·참조 보존·합성·구도는 생성 결과를 직접 확인한다. 이 가이드의 실제 품질 A/B는 수행되지 않았다."
template: |
  대상 버전/경로: {사용자가 지정한 버전과 실행 플랫폼; 미확인은 명시}
  입력 이미지: {실제 순서와 각 이미지의 역할}
  변경: {바꿀 요소}
  보존: {얼굴/제품 형태/구도/조명 등 필요한 항목}
  프롬프트 보강: {prompt upsampling 등 실제 노출·지원 확인 후에만 기재}
  검수: {문구, 색, 구도, 참조 역할 반영 여부}
pitfalls:
  - "FLUX 3 Image와 FLUX 3 Image Klein을 같은 요청 스키마로 가정하는 것(match_input·grounding·steps 필드 차이)"
  - "BFL API 설정을 제3자 플랫폼이나 내장 이미지 도구가 지원한다고 추정하는 것"
  - "FLUX.2 prompt_upsampling, FLUX 3 기능, 과거 모델의 negative prompt·guidance 문법을 한 카드에서 섞는 것"
  - "가이드 문서 대조나 API 입력 허용을 실제 생성·품질 A/B 검증으로 보고하는 것"
