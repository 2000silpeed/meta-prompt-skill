id: editing-and-runtime
model: black-forest-flux
topic: "참조 역할·버전별 편집 동작·플랫폼과 직접 API 경계"
verification: partial
last_verified: "2026-10-27"
rules:
  - "참조 이미지가 있으면 전달 순서에 맞춰 image 1, image 2 등으로 부르고 각각 편집 대상/인물/제품/의상/배경/스타일 중 역할을 지정한다. 대상 버전이 이미지 순번 참조를 지원하는지 확인한다."
  - "바꿀 항목과 보존할 항목을 구분해 적는다. 보존 요청은 목표이지 픽셀 단위 불변 보장이 아니며, 결과에서 직접 비교한다."
  - "FLUX.2 [pro]/[max] 가이드의 multi-reference 및 prompt_upsampling 설명은 해당 FLUX.2 모델과 이를 노출한 경로에 한정한다. prompt upsampling은 문장을 자동 확장·보강할 수 있으므로 정확한 문구, 최소 변경, 재현성이 중요한 작업에서는 실제 설정 노출 여부와 적용 결과를 확인하고 의도 변형 가능성을 알린다."
  - "FLUX 3 Image는 현재 별도 API 문서와 프롬프팅 페이지를 따른다. 해당 문서는 reference 이미지들의 역할·순서 지정과 최대 10개 입력을 다루며, prompt_upsampling 기능이 있다고 추정하지 않는다."
  - "대상 사용 경로가 명시되면 우선한다. BFL 직접 API 파라미터, Playground/외부 플랫폼의 UI 옵션, Codex 내장 도구 스키마는 서로 대체 근거가 아니다. 실제 노출된 입력과 버전을 확인하고, 확인 불가면 프롬프트 작성까지만 한다."
  - "현재 런타임에서 FLUX를 실행할 수 있다고 가정하거나, API 호출·생성·비용 발생을 완료했다고 말하지 않는다. 생성 도구가 없거나 권한·비용 조건이 불명확하면 텍스트 산출물과 실행 경계를 구분해 보고한다."
  - "공식 문서가 말하는 지원 기능과 자체 권장 검증을 구별한다. 입력 허용은 품질 증거가 아니며, 문자 정확성·색·참조 보존·합성·구도는 생성 결과를 직접 확인한다. 이 가이드의 실제 품질 A/B는 수행되지 않았다."
template: |
  대상 버전/경로: {사용자가 지정한 버전과 실행 플랫폼; 미확인은 명시}
  입력 이미지: {실제 순서와 각 이미지의 역할}
  변경: {바꿀 요소}
  보존: {얼굴/제품 형태/구도/조명 등 필요한 항목}
  프롬프트 보강: {prompt upsampling 등 실제 노출·지원 확인 후에만 기재}
  검수: {문구, 색, 구도, 참조 역할 반영 여부}
pitfalls:
  - "BFL API 설정을 제3자 플랫폼이나 내장 이미지 도구가 지원한다고 추정하는 것"
  - "FLUX.2 prompt_upsampling, FLUX 3 기능, 과거 모델의 negative prompt·guidance 문법을 한 카드에서 섞는 것"
  - "가이드 문서 대조나 API 입력 허용을 실제 생성·품질 A/B 검증으로 보고하는 것"
