id: prompt-composition
model: black-forest-flux
topic: "사용처·주요 피사체·순서·색상·정확한 문구"
verification: partial
last_verified: "2026-10-27"
rules:
  - "사용자가 특정 버전을 지목하면 그 버전의 카드 지침만 적용한다. 지정이 없으면 어떤 FLUX 버전/제품을 쓸지 확인하거나, 확인 불가를 밝히고 버전 중립적인 자연어 초안만 만든다."
  - "FLUX.2 [pro]/[max] 공식 가이드는 앞부분에 주 피사체, 핵심 행동, 중요한 스타일·맥락을 두고 순서를 중요하게 다룬다. 이를 모든 FLUX 세대에 대한 확정 규칙으로 확대하지 않는다."
  - "용도 → 주 피사체와 행동 → 필요한 구도·스타일·조명·세부 순으로 작성한다. 요청에 없는 렌즈·스토리·장식은 자동 추가하지 않는다."
  - "이미지 안에 들어갈 문구는 한국어를 포함해 요청 원문을 보존하고, 따옴표·위치·크기·서체 성격을 지정한다. 번역은 사용자가 요구했거나 목표 언어가 명시된 경우에만 한다."
  - "HEX 값은 대상 요소에 연결해 쓴다 (예: 배경 #F4EBDD, 제목 글자 #174A6E). 정확한 색 재현을 보증한다고 쓰지 말고 결과에서 확인한다."
  - "FLUX.2 [pro]/[max]와 FLUX 3 Image의 각 공식 문서는 negative prompt 미지원으로 설명한다. 해당 버전에서는 금지어 목록 대신 원하는 상태를 긍정적으로 묘사한다 (예: '군중 없음' 대신 '텅 빈 산책로'). 다른 모델/플랫폼의 별도 기능은 확인 없이 적용하지 않는다."
  - "JSON은 복잡한 구성을 정리하는 선택적 형식이다. 자연어에 비해 보편적으로 더 잘 작동한다고 단정하지 않으며, 대상 버전의 입력 규격이 요구하는 경우에만 API 구조체로 취급한다."
template: |
  용도: {사용처}
  장면: {주 피사체와 행동, 필요한 배경과 구도}
  표현: {매체/스타일, 조명, 재질 — 필요한 항목만}
  색상: {요소별 이름과 HEX — 필요한 경우}
  이미지 문구: "{요청 원문 그대로; 없으면 생략}"
  제약: {관찰 가능한 요구사항; 선택 버전이 지원하는 긍정 서술로 작성}
example: |
  세로형 카페 포스터용 제품 이미지를 만든다. 크림색 도자기 잔 하나를 나무 테이블 위 전경 중앙에 둔 따뜻한 아침 카페 장면. 창문에서 들어오는 부드러운 빛, 배경은 차분하게 흐린다. 테이블은 #6B4938, 잔의 유약은 #F4EBDD. 상단에 "오늘의 커피"를 한국어 원문 그대로, 읽기 쉬운 짙은 남색 세리프체로 한 번 표시한다.
pitfalls:
  - "FLUX.2의 길이·순서 안내를 FLUX 3 또는 FLUX.1 전체에 적용하는 것"
  - "영문 프롬프트를 쓴다는 이유로 이미지 속 한국어 문구를 번역하는 것"
  - "negative_prompt, 모델별 문법, UI 제어값을 버전 확인 없이 섞는 것"
