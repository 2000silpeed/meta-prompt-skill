  - url: "확인 불가 (2026-11-21)"
    covers: [editing-and-runtime]
    fetched: "확인 불가 (2026-11-21)"
    note: "Klein 가격 표는 릴리스 노트 수치만 기재했고 독립 확인하지 않았다. 플랫폼 노출 여부와 Klein 생성 품질 A/B는 확인하지 않았다. FLUX 3 Max/Action/Video(영상)와 FLUX-mimic(로보틱스)은 이 가이드북 범위 밖이라 열지 않았다."
