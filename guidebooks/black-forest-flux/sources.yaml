    note: "steps(1~16, 기본 16), seed, output_format, width/height 최소 64. grounding·match_input 없음. 릴리스 노트의 '같은 요청 형식' 설명과 충돌하여 레퍼런스 스키마를 우선 기재. 충돌은 공식 문서 간 불일치로 미해결."
