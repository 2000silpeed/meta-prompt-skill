    applies_to: "FLUX 3 Image API (POST /v1/flux-3-image)"
    note: "width/height 256~6256, resolution enum, aspect_ratio enum, grounding 기본 true, 참조 1~10개. 프롬프트 길이 상한과 참조 파일 크기 상한은 문서에 없어 확인 불가."
