id: at-reference-system
model: bytedance-seedance-2
topic: "@ 참조 시스템 — 자산별 역할 지정 (Seedance 프롬프트의 핵심)"
verification: partial   # 2.5 참조 상한은 2026-09-03 공식 발표 대조, 문법 예시는 2.0 기반
rules:
  - "입력 제한(2.5): 이미지 ≤30, 영상 ≤10, 오디오 ≤10 — 한 번의 생성에서 최대 50개 참조를 조합할 수 있다. 2.0 세대(즉몽 앱 기준)는 이미지 ≤9(각 30MB), 영상 ≤3(각 50MB, 합산 2~15초), 오디오 ≤3(각 15MB), 총 파일 ≤12로 훨씬 좁으므로 어느 세대를 쓰는지 먼저 확인한다."
  - "2.5는 참조 유형이 늘었다: 클레이 렌더(3D 블로킹으로 공간·카메라를 지정), 모션 참조, 크리에이티브 참조, 조명 참조. 복잡한 카메라 워크나 공간 배치는 말로 길게 쓰지 말고 클레이 렌더를 참조로 넣는 편이 정확하다."
  - "실사 인물 얼굴이 담긴 이미지/영상은 업로드 차단됨 — 프롬프트 설계 시 배제."
  - "모든 업로드 자산은 @Image 1, @Video 1, @Audio 1 (2.0 표기는 @Image1) 형식으로 참조하고, 각각의 역할을 반드시 명시한다."
  - "역할 문법: 'as the first/last frame', '@Image1's character as the subject', 'reference @Video1's camera movement', 'BGM references @Audio1', 'scene references @Image3', 'wearing the outfit from @Image2' 등."
  - "'reference @Video1'처럼 무엇을 참조할지 없는 지정은 금지 — camera/action/effects/rhythm/voice 중 명시."
  - "여러 참조는 한 프롬프트에 조합 가능하되, 업로드한 모든 자산에 역할이 있어야 한다."
template: |
  @Image1's character as the subject, scene references @Image2,
  reference @Video1's camera movement and action choreography,
  BGM references @Audio1. {이후 본문}
pitfalls:
  - "자산을 올려놓고 프롬프트에서 언급하지 않는 것 — 모델이 임의로 사용하거나 무시한다"
  - "참조 영상 사용 시 생성 비용이 다소 증가함을 사용자에게 고지"
