id: prompt-structure-timing
model: bytedance-seedance-2
topic: "프롬프트 조립 공식과 시간 분할"
verification: partial   # 2.5 길이·오디오 스펙은 2026-09-03 공식 발표 대조; 2026-11-21 BytePlus 2.5 프롬프트 가이드(시간 표기·편집·연장)와 2.5 프로젝트 페이지(30초) 대조, Flash 스펙 추가. 해상도 목록은 공급자 가이드에 없어 카탈로그 기준
note: "2026-10-27 시간 분할·동기화의 무조건적 표현을 제작 권장사항으로 수정. 2026-11-21 Flash·해상도 항목 추가. 모델 스펙 전체 재검증이나 실제 영상 품질 검증은 아님."
rules:
  - "기본 공식: [주체/캐릭터 설정] + [장면/환경] + [행동/모션] + [카메라 워크] + [타이밍 분할] + [전환/효과] + [오디오/사운드] + [스타일/무드]."
  - "2.5는 한 번의 생성으로 최대 30초를 원테이크로 만들고, 이어붙이기 없이 연장할 수 있다(연장 횟수는 공식 페이지 'extend twice'와 발표문 '다회 연장'이 엇갈려 미확정). 셋업–전개–전환–마무리로 이어지는 다중 샷을 한 프롬프트에 담을 수 있다. (2.0은 4~15초)"
  - "복수 행동의 순서·대사 시점·전환을 제어해야 하면 '0–3s: …', '3–6s: …'처럼 시간을 나눠 지시한다. 단일 행동·원테이크는 길이만을 이유로 임의 분할하지 않는다."
  - "구간당 하나의 핵심 행동만 — 4~5초에 여러 장면을 욱여넣으면 물리적으로 불가능한 결과가 나온다."
  - "2.5는 영상과 오디오를 함께 생성하는 경로를 제공한다. 대사·효과음·BGM의 원하는 시점을 명시하되 정확한 립싱크나 타격음 일치를 보장하지 않는다. 실제 재생·청취로 동기화와 자연스러움을 별도 확인한다. 2.0의 오디오 지원은 실행 경로에서 확인한다."
  - "타임스탬프 단위 편집 지시가 가능하다: 특정 구간만 지목해 수정·연장한다. 시간은 정수 초로 쓰고('0-3s', '[1s-4s]'), 구간 사이에 빈 시간을 두지 않는다(BytePlus 2.5 가이드). 빠르게 바뀌는 동작에는 타임스탬프가 잘 맞지 않는다."
  - "출력 스펙: 2.5는 최대 30초(최소 4초, 카탈로그 기준), 2.5 Flash는 4~30초이며 480p/720p만 낸다(2026-11-21 Higgsfield 카탈로그·공지 기준; BytePlus 활동 페이지는 Flash의 출시일·모델 ID·스펙을 주지 않아 확인 불가). 2.0은 4~15초(480p~720p). 2.5 해상도는 Higgsfield 카탈로그 기준 480p/720p/1080p/4k이고, BytePlus 가이드는 해상도 목록을 주지 않는다 — 플랫폼과 공급자 API의 옵션을 구분해 쓴다. 2.5 Flash는 2026-11-12 Higgsfield 공지 기준 미국에서 제공되지 않는다."
  - "생성 길이 설정과 프롬프트의 시간 분할 총합을 일치시킨다."
template: |
  {subject & character setup}. {scene/environment}.
  0–{t1}s: {opening — scene, camera, action}
  {t1}–{t2}s: {development}
  {t2}–{t3}s: {climax or key action}
  {t3}–{t4}s: {resolution, ending shot, text/branding}
  Sound: {BGM direction, sound effects}.
  Style: {visual style, mood}.
pitfalls:
  - "타이밍이 중요한 복수 행동의 순서를 지정하지 않거나, 단일 행동에 불필요한 구간·전환을 추가하는 것"
