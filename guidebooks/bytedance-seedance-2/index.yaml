model: bytedance-seedance-2
label: "Seedance 2.x (2.5 / 2.0)"
output_language: english-prompt   # 프롬프트는 영어, 해설은 한국어

slots:
  required:
    - id: video_goal
      ask: "어떤 영상인가요? (장르/용도: 광고, 드라마, MV, 교육 등 + 핵심 내용 한 줄)"
  optional:
    - id: assets
      default: "없음 (순수 텍스트 생성)"
      note: "보유한 참조 이미지/영상/오디오(2.5는 클레이 렌더·모션·조명 참조 포함) — @ 시스템 설계에 필수"
    - id: model_generation
      default: "2.5"
      note: "2.5 = 30초 원테이크 + 네이티브 오디오 + 참조 50개. 2.0 = 4~15초, 참조 12개"
    - id: duration
      default: "10초"
      note: "2.5는 최대 30초(연장 가능), 2.0은 4~15초. 10초 이상이면 시간 분할 프롬프트 적용"
    - id: camera
      default: "내용에 맞게 카드에서 선택"
    - id: style_mood
      default: "cinematic"
    - id: audio
      default: "2.5는 영상과 동시 생성 — 대사·효과음·BGM을 구간별로 지시"

cards:
  - id: at-reference-system
    when: "항상 로드 (참조 자산이 없어도 입력 제한·구조 확인용)"
  - id: prompt-structure-timing
    when: "항상 로드 (프롬프트 조립 공식)"
  - id: camera-language
    when: "카메라 워크 지정이 필요할 때 (대부분의 경우)"
  - id: capability-patterns
    when: "영상 연장, 편집, 비트매칭, 대사, 캐릭터 일관성 등 특수 기능을 쓸 때"
  - id: style-and-pitfalls
    when: "항상 로드 (마무리 점검용 — 스타일 수식어와 흔한 실수)"
