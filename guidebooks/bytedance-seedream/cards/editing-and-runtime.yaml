id: editing-and-runtime
model: bytedance-seedream
topic: "Pro/Flash 버전·선택 영역 편집·출력 제약"
verification: partial
last_verified: "2026-10-27"
note: "BytePlus 공식 튜토리얼의 기능·설정 확인. 현재 계정·외부 플랫폼 지원과 실제 실행 결과는 미확인."
rules:
  - "사용자가 지정한 버전과 플랫폼을 먼저 유지한다. BytePlus 직접 API의 5.0 Pro ID는 dola-seedream-5-0-pro-260628, Flash ID는 dola-seedream-5-0-flash-260915다. 이름에 5.0이 같아도 Lite나 다른 제공자의 ID로 대체하지 않는다."
  - "5.0 Pro/Flash 직접 API는 최대 10개 참조와 1K/1.5K/2K 출력을 다룬다. size의 해상도 등급과 WIDTHxHEIGHT는 대안 형식이며 동시에 넣지 않는다. Higgsfield 등 다른 경로에서는 실제 노출 옵션을 확인한다."
  - "정밀 편집은 표시된 원본이나 실제 이미지에서 확인한 영역을 사용한다. Pro/Flash의 <point>/<bbox> 지시는 좌표 형식·정규화 기준을 공식 문서와 원본 크기로 확인한 경우에만 쓴다. 좌표를 추정해 만들지 말고, 영역 표시·자연어 위치를 쓸 수 있으면 우선한다. 표시선을 쓴 경우 결과에서 표시선 제거도 요청한다."
  - "Pro/Flash는 순차 다중 이미지 생성과 스트리밍을 지원하지 않는다. 5.0 Lite·4.5·4.0의 sequential_image_generation/stream 설정을 복사하지 않는다. 여러 독립 시안이 필요하면 요청 장수에 맞는 별도 호출 계획을 만들고 승인된 실행 범위를 따른다."
  - "Pro/Flash의 layer_decomposition은 하나의 입력에서 베이스와 최대 16개의 알파 레이어를 얻는 기능이며, 여러 독립 시안을 만드는 기능이 아니다. 요청된 경우에만 사용하고 위치·쌓임 순서를 보존한다."
  - "Pro/Flash 직접 API에서 background=transparent는 알파 채널이 있는 입력 이미지 정확히 1개를 사용하는 이미지 편집에만 지원되며 출력은 PNG여야 한다. 텍스트만으로 투명 이미지를 생성하는 범용 옵션으로 안내하지 않는다. PNG 형식만 지정했다고 투명이 되는 것도 아니다."
  - "API 설정은 프롬프트 본문과 분리한다. 지원이 확인되지 않은 파라미터나 다른 이미지 도구의 옵션을 만들지 않는다. API 반환 이미지 URL은 24시간 유효하므로 실행한 경우 결과 파일·원본 프롬프트·버전을 보관한다."
template: |
  대상: {명시 모델 버전과 플랫폼}
  입력: {실제 이미지와 역할; 정밀 편집이면 확인된 영역}
  지시: {변경할 부분과 보존할 부분}
  출력: {요청 장수·크기·형식; 레이어 분해는 요청됐을 때만}
  API 설정: {선택한 경로에서 확인된 필드만 별도 기재}
pitfalls:
  - "Seedream 이미지 요청을 이름이 비슷한 Seedance 영상 가이드로 보내는 것"
  - "Pro/Flash를 Lite·4.x와 같은 다중 출력·스트리밍 모델로 취급하는 것"
  - "좌표·알파 입력·참조 이미지를 확인하지 않고 정밀 편집이나 투명 출력을 보장하는 것"
