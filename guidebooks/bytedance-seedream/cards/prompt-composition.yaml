id: prompt-composition
model: bytedance-seedream
topic: "장면·디자인 구성·정확한 문구·참조 역할"
verification: partial
last_verified: "2026-10-27"
note: "공식 프롬프트 권장과 기능을 대조했다. 템플릿은 로컬 작성 권장이며 실제 생성 품질 A/B는 수행하지 않았다."
rules:
  - "피사체 + 행동 + 환경을 자연어로 연결하고, 필요한 스타일·색·조명·구도를 보탠다. 짧은 요청에 불필요한 장식이나 키워드 목록을 붙이지 않는다. 공식 튜토리얼의 600 영어 단어 이내 권장은 상한 안내이지 채울 분량이 아니다."
  - "포스터·슬라이드·도표는 용도, 제목/본문의 위계, 요소 간 위치를 설명한다. 수치·표·브랜드 문구는 제공된 자료만 사용한다. 디자인 기능을 사실 조사나 숫자 정확성의 보장으로 해석하지 않는다."
  - "이미지 안에 넣을 문자열·줄바꿈·문장부호는 요청 그대로 유지한다. 5.0 Pro/Flash는 한국어를 지원하므로 영어로 강제 번역하지 않는다. 복잡한 조판의 정확성은 결과 이미지에서 확인한다."
  - "여러 참조는 실제 전달 순서대로 이미지 1, 이미지 2 등으로 부르고 각 역할을 적는다. 예: 이미지 1의 제품 형태, 이미지 2의 색상, 이미지 3의 배치. 서로 충돌하는 참조는 우선순위를 명시한다."
  - "참조가 있는 신규 생성과 원본 편집을 구분한다. 편집은 바꿀 요소와 보존할 요소를 함께 적고, 제공되지 않은 참조나 자산 버전이 있다고 쓰지 않는다. 공용 image-production의 시각 검수 기준을 함께 적용한다."
template: |
  용도: {사용처와 결과물}
  장면/배치: {피사체 + 행동 + 환경, 필요한 요소의 위치}
  표현: {필요한 매체·색·빛·재질}
  문구/데이터: {제공 원문 그대로; 없으면 생략}
  참조 역할: {실제 이미지 순서별 역할; 없으면 생략}
  변경/보존: {편집일 때만}
example: |
  카페 메뉴용 세로 포스터. 제공된 이미지 1의 컵 형태와 로고를 유지해 컵 하나를 화면 아래쪽 중앙에 배치한다. 배경은 이미지 2의 크림색과 차분한 질감을 참고한다. 상단 여백에 "오늘의 커피"를 요청 원문 그대로 한 번 넣는다. 새 로고나 가격을 추가하지 않는다.
pitfalls:
  - "디자인 이해·다국어 지원을 완벽한 조판이나 사실 정확성으로 표현하는 것"
  - "참조 이미지 역할을 구분하지 않거나, 참조에 없는 제품 정보를 발명하는 것"
