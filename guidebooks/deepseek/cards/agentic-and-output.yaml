id: agentic-and-output
model: deepseek
topic: "DeepSeek V4.1 도구 호출·멀티턴·JSON 출력"
verification: verified   # 2026-10-14 현재 thinking mode 문서에서 reasoning_content replay 동작 재대조
rules:
  - "도구를 쓰지 않는 일반 멀티턴에서는 이전 턴의 reasoning_content를 되돌려 보내지 않는다 — 무시된다."
  - "요청에 tools 필드가 있으면 도구를 실제 호출하지 않은 턴까지 포함해 모든 이전 assistant reasoning_content를 후속 요청에 그대로 돌려보낸다. 빠지면 400이 난다. 하네스가 히스토리를 요약·편집한다면 이 필드를 보존한다."
  - "V4는 한 턴 안에서 추론과 도구 호출을 여러 번 반복한다. 도구 계약(목적·입력·출력·오류)과 중단 조건을 명확히 주면 이 반복이 짧아진다."
  - "Chat Completions thinking mode에서는 tool_choice=required와 특정 함수 강제 선택이 지원되지 않아 400 오류가 난다. 기본 auto를 쓰거나 thinking을 끈다."
  - "Chat Completions의 JSON 출력은 response_format: {type: json_object}를 사용하고 프롬프트에 json과 원하는 형식 예시를 넣는다. 이 모드는 JSON 문법을 보장하는 기능이며 필드 스키마 검증과 다르므로, 수신 측에서 필수 필드·타입을 검증한다."
  - "1M 컨텍스트를 쓸 때는 고정 프리픽스를 앞에 두어 컨텍스트 캐시가 걸리게 한다."
template: |
  # Task
  {task_goal}
  # Tools
  {tool_name}: {목적 / 입력 스키마 / 출력 필드 / 오류 의미}
  # Stopping rules
  {언제 도구를 더 부르고, 언제 멈춰 답을 쓰는가}
  # Output
  {JSON 스키마 또는 사람용 형식}
pitfalls:
  - "도구 사용 멀티턴에서 reasoning_content를 누락해 400을 맞는 것"
  - "반대로 도구 없는 대화에서 reasoning_content를 쌓아 토큰만 낭비하는 것"
  - "JSON을 프롬프트 문구로만 요구해 코드펜스가 섞여 나오는 것"
