id: v4-thinking-and-params
model: deepseek
topic: "DeepSeek V4.1-Flash 모델 ID와 thinking/non-thinking 전환"
verification: verified   # 2026-10-14 공식 V4.1 공지·Models & Pricing·thinking mode 대조; Pro 라우팅 자료 상충은 명시
rules:
  - "현재 권장 Flash API ID는 deepseek-flash이며 모델 버전은 DeepSeek-V4.1-Flash다. 공식 Models & Pricing는 1M context, 최대 출력 384K, thinking/non-thinking, tool calls, Responses·Anthropic API, vision 입력을 표시한다."
  - "V4-Flash와 V4-Flash-Vision-Exp는 2026-09-10 은퇴 공지됐고 deepseek-v4-flash / deepseek-v4-flash-vision-exp는 호환을 위해 임시로 V4.1-Flash로 라우팅된다. 새 호출에는 deepseek-flash를 쓴다."
  - "Pro ID에는 공식 문서 사이의 현재 불일치가 있다: 2026-09-10 공지는 9/14부터 deepseek-v4-pro 요청을 V4.1-Flash 가격으로 V4.1-Flash에 라우팅한다고 하지만, 현재 Models & Pricing 표는 같은 ID를 DeepSeek-V4-Pro-0813(별도 가격·vision 미지원)으로 기재한다. Pro가 꼭 필요하면 실행 시 /models 응답과 계정 콘솔로 확인하고 이름만으로 tier를 단정하지 않는다."
  - "레거시 ID deepseek-chat / deepseek-reasoner는 2026-07-24에 은퇴했으므로 새 코드에 쓰지 않는다."
  - "V4 계열은 reasoner 전용 모델이 없는 이중 모드 구조다 — thinking 여부·깊이는 요청 파라미터로 고른다. thinking은 기본 활성, 기본 effort는 high다."
  - "프로토콜마다 필드가 다르다: OpenAI Chat Completions는 `extra_body.thinking.type`과 `reasoning_effort`(none/low/high/max)를 쓴다. Responses API의 request schema는 `reasoning.effort`(none/low/high/max)를 받는다. Anthropic 가이드는 `output_config`에 effort만 지원한다고 적지만 이 요약 표의 필드 대응은 모호하므로, Anthropic wire format 요청은 해당 가이드의 현재 예시를 그대로 따른다."
  - "thinking mode에서는 temperature / presence_penalty / frequency_penalty가 무시된다. top_p는 thinking에서만 적용되며 유효 범위는 0.95–1.0이고, non-thinking에서는 1.0으로 고정된다."
  - "공식 API는 OpenAI Chat Completions, Responses, Anthropic Messages 형식을 지원한다. 모델 ID·thinking 필드·이미지 입력 가능 여부는 프로토콜별 최신 문서와 모델표를 확인한다."
  - "단순 분류·형식 변환·짧은 요약은 non-thinking(또는 effort none/low)으로 내려 지연과 비용을 줄이고, 다단계 추론·디버깅·계획 수립에서만 high/max를 쓴다."
template: |
  {프롬프트 본문}

  # API 권고
  model: deepseek-flash
  thinking: {"type": "enabled"}          # OpenAI 호환 형식
  reasoning_effort: {low | high(기본) | max}
  (temperature/penalty는 thinking 모드에서 무시; top_p는 0.95–1.0 범위만 적용)
  (thinking 비활성화는 Chat Completions의 reasoning_effort=none 또는 thinking.type=disabled; Responses의 reasoning.effort=none)
pitfalls:
  - "새 호출에 은퇴한 deepseek-v4-flash / deepseek-v4-flash-vision-exp / deepseek-chat / deepseek-reasoner를 기본 ID로 쓰는 것"
  - "공지와 현재 pricing table이 다른 deepseek-v4-pro ID의 실제 제공 tier를 확인 없이 가정하는 것"
  - "thinking mode에서 temperature나 penalty를 조정해 효과가 있다고 보거나, top_p를 0.95 미만으로 낮추는 것"
  - "간단한 작업까지 기본 effort high로 돌려 비용·지연을 키우는 것"
