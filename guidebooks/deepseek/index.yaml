model: deepseek
label: "DeepSeek V4.1-Flash (deepseek-flash) / V4-Pro"
output_language: follow-target

slots:
  required:
    - id: task_goal
      ask: "이 프롬프트로 DeepSeek이 정확히 무엇을 해내야 하나요?"
  optional:
    - id: model_variant
      default: "deepseek-flash"
      note: "현행 V4.1-Flash API ID, vision 포함. V4-Pro ID의 라우팅은 공식 notice와 pricing table이 서로 달라 런타임 카드 확인"
    - id: thinking
      default: "활성 (기본)"
      note: "단순 변환·분류는 non-thinking으로 지연·비용 절감"
    - id: reasoning_effort
      default: "high"
      note: "thinking mode 기본 high; low/high/max 지원. 프로토콜별 설정은 런타임 카드 확인"
    - id: output_format
      default: "자유 산문"

cards:
  - id: v4-thinking-and-params
    when: "항상 로드 (V4.1 모델 ID·기존 별칭·thinking·파라미터 제약)"
  - id: agentic-and-output
    when: "도구 호출, 멀티턴 에이전트, JSON/구조화 출력이 관련될 때"
