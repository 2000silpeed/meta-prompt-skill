id: gemini-3-runtime  # 기존 카드 경로·참조 호환을 위해 ID 유지
model: google-gemini
topic: "Gemini 4 / 3 런타임 — 모델 선택, thinking_level, long decode와 마이그레이션"
verification: verified   # 2026-10-14 Gemini 4 Argon 모델·latest-model·long-decode 문서 대조; 기존 3.x 규칙은 제한적으로 보존
rules:
  - "복합 추론·코딩·에이전트의 최신 기본은 stable gemini-4-argon이다. 입력·thinking·출력이 공유하는 컨텍스트는 1,048,576 토큰이고 일반 최대 출력은 65,536이다. 빠른 고처리량 작업은 stable gemini-3.8-flash, 비용 중심 작업은 3.1 Flash-Lite를 검토한다. Gemini 3.1 Pro는 preview 모델이다."
  - "Argon은 thinking_level low / medium(기본) / high를 지원한다. 단순·지연 민감 요청은 low, 대부분의 코드·에이전트 작업은 medium, 어려운 수학·과학·최난도 코드는 high로 둔다. minimal은 오류다."
  - "Argon 호출에서는 temperature / top_p / top_k를 요청에서 제거한다(무시됨). thinking_budget 대신 thinking_level을 쓴다. Gemini 3.x에 관한 기존 API 규칙을 Argon에 그대로 적용하지 않는다."
  - "64K를 넘는 단일 응답이 실제로 필요할 때만 long decode를 켠다: background=true와 max_output_tokens>65,536을 지정하고, 최신 GenAI SDK 자동 continuation 또는 직접 continuation을 사용한다. 더 긴 출력은 64K 단위 hop으로 이어지며 전체 입력·thinking·출력이 공유 1M 한도 안에 든다."
  - "long decode가 필요한 GenerateContent 호출은 Google GenAI SDK Python 2.30.1 / JS 2.29.1 이상을 사용하고 클라이언트 read timeout을 최소 15분으로 둔다. 일반 채팅과 짧은 도구 턴에는 불필요하다."
  - "Argon에는 explicit context caching이 지원되지 않는다. 긴 고정 프리픽스에는 기본 implicit caching이 적용될 수 있다. 멀티턴은 previous_interaction_id로 서버 상태를 잇는다."
  - "Gemini 3.x 호환 경로: gemini-3.8-flash는 thinking_level low / medium(기본) / high이고 minimal은 미지원이다. 3.x의 샘플링·thought-signature 제약은 3.x 요청에만 적용한다."
  - "이미지·PDF 입력이 많으면 media_resolution 설정으로 토큰과 정확도를 조절한다. high로 올릴 때 컨텍스트 초과 여부를 먼저 확인한다."
  - "Gemini 3.x는 structured outputs와 내장 툴(Google Search, URL Context, Code Execution) + 커스텀 function calling을 동시에 쓸 수 있다. 에이전트 프롬프트는 이 조합을 전제로 설계한다."
  - "FunctionResponse에는 call_id와 name을 반드시 포함한다."
template: |
  {프롬프트 본문 — 짧고 직접적으로}

  # API 권고
  model: gemini-4-argon
  thinking_level: {low | medium(기본) | high}
  max_output_tokens: {일반 작업은 기본 65536; 장문 코딩·증명은 131072 이상 검토}
  background: {65K 초과 long decode가 필요할 때만 true}
  previous_interaction_id: {멀티턴이면 서버 상태로 이어가기}
pitfalls:
  - "Argon에 temperature/top_p/top_k나 thinking_budget을 보내 파라미터가 반영된다고 가정하는 것"
  - "Argon에서 explicit cachedContents를 만들거나 재사용하는 것"
  - "background=true만 켜고 max_output_tokens를 올리지 않아 64K에서 응답이 끝나는 것"
  - "long decode에 지원 버전보다 오래된 SDK를 사용해 continuation이 자동 처리될 것으로 기대하는 것"
  - "3.x 전용 thinking·멀티턴 규칙을 Argon에 무차별 적용하는 것"
