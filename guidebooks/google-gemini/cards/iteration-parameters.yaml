id: iteration-parameters
model: google-gemini
topic: "반복 개선과 모델별 파라미터 (Gemini 4 / 3)"
verification: partial   # 2026-11-21 Gemini 4 Neon의 thinking 단계·기본값(high) 대조(thinking 표·모델 페이지); Neon 샘플링 안내는 페이지에 없음. Hydrogen·Carbon·Argon 규칙은 11/16 검증 유지; 3.x 규칙과 표현 재시도 지침은 10/14 검증 유지
rules:
  - "결과가 불안정하면 파라미터부터 만지지 말고 표현을 바꿔 재시도한다: 동의어 교체, 유사 태스크로 재프레이밍(분류→완성 유도), 지시 순서 변경."
  - "Gemini 4에서는 thinking_level이 품질·지연·토큰 사용의 주 조절값이다. 비용·지연 민감 작업은 low, 대화형 코딩·응답성 중요한 작업은 medium, 복잡한 코딩·에이전트는 high로 조정한다. Hydrogen·Neon의 xhigh는 high로 부족한 다단계 문제에만 쓴다. 기본값은 Hydrogen·Neon이 high, Carbon·Argon이 medium이다(Neon 기본값은 aistudio thinking 표, 2026-11-21 확인)."
  - "Gemini 4는 temperature/top_p/top_k를 무시하므로 요청에서 제거한다(Neon의 샘플링 처리는 aistudio 페이지에 명시가 없어 Hydrogen·Carbon·Argon과 같이 적용하되 미확인으로 둔다). Gemini 3.x에는 해당 모델 문서의 규칙을 따른다: 예를 들어 3.8 Flash는 thinking_level low/medium/high이고 temperature 기본값 1.0을 유지한다."
  - "결정성이 필요한 분류·추출은 Gemini 4의 무시되는 샘플링 값을 조정하지 말고 구조화 출력 스키마와 명확한 지시로 잠근다."
  - "프롬프트가 길어질수록 핵심 제약을 시작과 끝에 한 번씩 반복하는 것은 여전히 유효하다."
  - "같은 프롬프트로 여러 번 돌릴 계획이면 고정 부분을 앞에, 매 요청 달라지는 부분을 뒤에 두어 캐시 적중률을 높인다."
template: |
  {프롬프트 본문}

  # 권고 파라미터 (선택한 모델에 맞춰 적용)
  thinking_level: {Hydrogen·Neon: low/medium/high/xhigh; Carbon·Argon: low/medium/high; 3.8 Flash: low/medium/high}
  sampling: {Gemini 4는 temperature/top_p/top_k 전송 금지; 3.x는 해당 모델 기본값 유지}
pitfalls:
  - "Gemini 4 요청에 temperature/top_p/top_k를 넣고 값이 적용될 것으로 가정하는 것"
  - "Gemini 4 규칙을 Gemini 3.x에 그대로 옮기거나 3.x 파라미터 규칙을 Gemini 4에 옮기는 것"
  - "불안정성을 샘플링 값부터 바꿔 해결하려는 것 — thinking level과 스키마부터 조정한다"
