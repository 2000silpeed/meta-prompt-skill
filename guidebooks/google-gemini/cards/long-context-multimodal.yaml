id: long-context-multimodal
model: google-gemini
topic: "롱 컨텍스트와 멀티모달 입력 배치"
verification: knowledge-based
rules:
  - "긴 문서·미디어는 프롬프트 앞에, 질문/지시는 맨 뒤에 배치한다. 대용량 컨텍스트에서 질문을 끝에 두는 것이 성능에 유의미하다."
  - "멀티모달 입력이 여럿이면 각 자산의 역할을 텍스트로 명시한다: '첫 번째 이미지는 제품, 두 번째는 참고 스타일.'"
  - "영상 입력은 타임스탬프로 특정 구간을 지시할 수 있다: '02:30 부근의 장면에서…'"
  - "문서 다수 입력 시 각 문서에 제목/ID를 붙이고, 답변에 출처 표기를 요구한다."
  - "같은 대용량 컨텍스트로 여러 질문을 할 계획이면 context caching 사용을 권고 (비용 절감)."
template: |
  {문서/미디어 입력 — 각 자산에 역할 라벨}

  ---
  위 자료를 근거로:
  {task_goal — 맨 뒤 배치}
  각 주장에 출처(문서 ID/타임스탬프)를 표기하라.
pitfalls:
  - "질문을 앞에 두고 문서를 뒤에 붙이는 것 — 롱 컨텍스트에서 회수율이 떨어진다"
