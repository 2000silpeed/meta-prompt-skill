id: structure-pctf
model: google-gemini
topic: "PCTF 참고 구조 — Context, Task, Format과 선택적 Persona"
verification: partial
note: "기존 가이드의 구조·예시 규칙은 유지한다. 페르소나 선택은 로컬 운용 원칙이며 Gemini의 품질 향상을 새로 검증한 변경은 아니다."
rules:
  - "Context(배경·입력) / Task(할 일) / Format(출력 형식)을 과업에 맞게 구체화한다. PCTF의 Persona(역할)는 필수 항목이 아니며, 필요한 역할극·말투·검토 관점·업무 책임이 있을 때만 추가한다."
  - "'세계적인 전문가', '절대 실수하지 않는다' 같은 수식어 대신 수행할 작업과 판단 기준을 명시한다."
  - "Task는 동사로 시작하는 명확한 명령으로: 'Summarize...', 'Classify...', '분석하라'."
  - "제약은 부정형 대신 긍정형으로: '전문용어를 쓰지 마라'보다 '중학생이 이해할 수 있는 어휘로'."
  - "few-shot 예시를 넣을 땐 입력/출력 라벨 형식을 일관되게 (Input:/Output: 또는 XML). Gemini는 예시의 패턴을 강하게 따른다."
  - "완성 유도 방식(문장 앞부분을 주고 잇게 하기)도 잘 작동한다 — 분류·변환 태스크에서 유용."
template: |
  Context:
  {배경 정보, 입력 데이터}

  Task:
  {동사로 시작하는 명확한 지시}

  Format:
  {출력 구조, 길이, 어조}
pitfalls:
  - "배경·지시·형식의 경계가 모호해 필요한 작업을 구분하기 어려운 프롬프트"
  - "PCTF의 모든 칸을 채우려고 불필요한 페르소나를 추가하는 것"
