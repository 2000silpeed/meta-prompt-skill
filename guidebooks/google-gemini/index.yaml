model: google-gemini
label: "Google Gemini 4 Argon / 3.x"
output_language: follow-target

slots:
  required:
    - id: task_goal
      ask: "이 프롬프트로 모델이 정확히 무엇을 해내야 하나요?"
  optional:
    - id: model_variant
      default: "gemini-4-argon"
      note: "복합 추론·코딩·에이전트 기본. 빠르고 저렴한 대량 작업은 3.8 Flash/3.1 Flash-Lite; 3.1 Pro는 preview 유지"
    - id: thinking_level
      default: "medium"
      note: "Argon은 low/medium/high (기본 medium, minimal 미지원); 3.x 모델별 지원은 런타임 카드 확인"
    - id: input_description
      default: "사용자 요청에서 추론"
      note: "멀티모달 입력(이미지/영상/PDF) 여부가 중요"
    - id: output_format
      default: "자유 산문"
    - id: audience_tone
      default: "일반"

cards:
  - id: gemini-3-runtime
    when: "항상 로드 (Gemini 4/3 모델 선택·thinking_level·마이그레이션)"
  - id: structure-pctf
    when: "항상 로드 (프롬프트 조립 골격)"
  - id: long-context-multimodal
    when: "긴 문서(수십만 토큰) 또는 이미지/영상/오디오/PDF 입력이 있을 때"
  - id: structured-output
    when: "JSON 등 기계가 파싱할 출력이 필요할 때"
  - id: iteration-parameters
    when: "결과가 불안정하거나 지연·품질 트레이드오프 조정이 필요할 때"
