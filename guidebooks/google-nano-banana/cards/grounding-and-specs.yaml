id: grounding-and-specs
model: google-nano-banana
topic: "실시간 그라운딩과 모델 변형·스펙 선택"
verification: partial   # Nano Banana 2.1 공식 문서 대조 2026-10-14; 전체 계열/제품 표면 동등성은 미검증
rules:
  - "실세계 데이터 반영 공식: [Source/Search request] + [Analytical task] + [Visual translation]. 허구 장면 묘사가 아니라 '검색해서 그 데이터를 이렇게 시각화하라'로 지시한다. 예: 'Search for current weather in San Francisco, use this data to modify the scene, visualize as a miniature city-in-a-cup.'"
  - "모델 변형 선택: gemini-nano-banana-2.1(Nano Banana 2.1, 새 기본·1K/2K/4K), gemini-3-pro-image(Nano Banana Pro, 전문 자산·정밀 제어), gemini-3.1-flash-image(Nano Banana 2, 이전 세대·deprecated이나 종료일 미정), gemini-3.1-flash-lite-image(Nano Banana 2 Lite, 빠르고 저렴하며 1K만·다중 참조/멀티턴 순차 편집 비최적화), gemini-2.5-flash-image(레거시)."
  - "Nano Banana 2.1은 Flash 수준 속도·비용을 유지하면서 시각 품질, 프롬프트 준수, 멀티턴 인물 일관성, 텍스트 렌더링, 검색 그라운딩을 개선했다. 3.1 Flash Image에서 2.1로 새 작업을 옮기되, 기존 모델 ID가 필요한 작업은 종료 공지가 나기 전까지 보존한다."
  - "2.1 해상도는 1K/2K/4K이며 0.5K는 지원하지 않는다. Nano Banana 2(3.1 Flash Image)는 0.5K~4K, Lite는 1K만, Pro는 1K~4K. 공통 비율 외 2.1/3.1 Flash는 1:4·4:1·1:8·8:1 파노라마도 지원한다."
  - "영상에서 이미지 뽑기(video-to-image)는 현재 공식 가이드상 gemini-3.1-flash-image에서 지원한다 — YouTube URL이나 업로드한 영상을 입력으로 둔다. 2.1 지원으로 일반화하지 않는다."
  - "2.1은 Google Search와 Google Image Search grounding을 지원하며, 3.1 Flash도 두 검색 grounding을 지원한다. Lite는 검색 grounding을 지원하지 않는다. 웹 검색 기반 인물 사진은 2.1/3.1 Flash에서 사용할 수 없다."
  - "2.1의 thinking level은 minimal / medium(기본) / high다. 복잡한 합성·다중 제약에는 high, 단순한 작업에는 minimal을 고려한다. 이전 3.1 Flash/Lite Image는 minimal(기본) / high로 구분한다."
  - "만화/스토리보드는 패널 수와 스타일을 명시: 'Make a 3 panel comic in a gritty, noir art style.'"
  - "생성 이미지에는 SynthID 워터마크가 포함된다. C2PA Content Credentials의 전 계열 적용 여부는 이 가이드에서 확인하지 않았으므로 보장하지 않는다."
  - "영상이 최종 목표면 나노바나나로 키프레임을 만들고 Veo로 영상화하는 연계가 공식 권장 경로."
pitfalls:
  - "실시간 정보가 필요한데 허구 묘사로 쓰는 것 — 검색 지시형으로 전환"
  - "배너 비율(8:1 등)이 필요한데 크롭을 전제로 1:1 생성하는 것"
