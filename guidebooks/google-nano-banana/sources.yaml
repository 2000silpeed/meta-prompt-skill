    note: "ai.google.dev/gemini-api/docs/image-generation의 이동 URL로 확인. 모델 ID 5종, 1K/2K/4K 해상도, 0.5K는 3.1 Flash Image에만, 파노라마 비율, 참조 한도(2.1/3.1 Flash 오브젝트 10·캐릭터 4, Pro 6·5·스타일 3), thinking 기본값, 검색 grounding 범위 확인. 텍스트 렌더링·참조 한도 표·스타일/제품/편집 프롬프트 예시는 0~200,000자 구간에서 확인했고 10/14 이후 날짜 공지는 없었다. 200,000자 이후(전체 241,078자)는 읽지 않아 확인 불가. Lite 참조 개수 14는 이 페이지에서 확인하지 못했다(Lite는 다중 참조 비최적화만 기재)."
