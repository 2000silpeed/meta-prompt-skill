id: model-routing
model: higgsfield
topic: "모델·툴 라우팅 — 생성 전에 올바른 경로부터"
verification: partial   # 공식 플랫폼 공지와 현재 읽기 전용 models_search 결과를 2026-10-14 대조; 모델 카탈로그/도구는 연결 환경에 따라 다름
rules:
  - "Higgsfield는 멀티모델 플랫폼. 현재 연결 도구 카탈로그에는 읽기 전용 models_search, models_get, models_recommend가 있다. 모델이 불명확하면 models_recommend에 목표를 전달하고, 특정 모델은 models_search/get으로 연결 카탈로그 등록 여부와 제약을 확인한 다음 고른다. models_explore는 현재 카탈로그에 없다."
  - "생성인지 기존 자산 편집인지 먼저 분류한다. 업스케일, 확장, 리프레임, 배경 제거는 Higgsfield UI의 해당 편집 도구로 라우팅하고, 일반 generate_image/video 프롬프트로 다시 만들지 않는다. 현재 연결 MCP에는 각 기능의 독립 `upscale_image`, `outpaint_image`, `reframe`, `remove_background` 도구가 노출되지 않는다."
  - "광고·UGC·내레이션 영상 등 완성형 서사 워크플로는 요청 형식에 맞는 Higgsfield 워크플로/프리셋을 확인한다. 현재 연결 카탈로그에서는 get_preset_instructions와 get_faceless_channel_presets가 확인되며, get_workflow_instructions와 get_game_creation_instructions는 확인되지 않는다."
  - "2026-10-14 플랫폼 후보 라인업: 영상 Seedance 2.5, Kling 3.0/Turbo, Veo 3.1, Sora 2, Wan 3.0/3.0 Prime, Grok Imagine Video 1.5(현재 MCP 표시명 Grok Video 1.5), Gemini Omni 1.1 Flash, MiniMax H3 Max; 이미지 Nano Banana Pro, GPT Image 2.5(Flare 기본·Sunburst 정밀 편집), Seedream 5.0 Pro/Flash, FLUX 3 Image. 이 목록은 공식 Higgsfield 게시물 및 모델 검색으로 확인한 후보이며, 실제 호출 전 현재 models_search/get 결과를 우선한다."
  - "Seedance 2.5는 Higgsfield Draft Mode에서 먼저 480p 미리보기를 만들고 선택한 안을 1080p로 확정할 수 있다. 프롬프트·참조·seed·비율·길이는 최종화 때 유지되고, 최대 30초이며 초안은 7일 안에 확정한다. 시작/끝 프레임과 오디오를 초안에서 검토할 수 있다. 공식 공지상 미국에서는 제공되지 않는다."
  - "Grok Imagine Video 1.5는 사운드를 영상과 함께 만들며 text/image/reference-to-video와 연장 기능을 안내한다. 플랫폼 공지는 1~15초·최대 1080p·참조 이미지 7개를 명시한다. 연결 MCP 모델 항목은 `Grok Video 1.5`로 표시되고 시작 이미지/이미지·오디오 참조, 2~15초를 노출하므로 세부 입력은 현재 models_get 결과를 따른다."
  - "Wan 3.0/Prime은 기존 Wan 2.6 라인업 표기를 갱신한다. 공식 플랫폼은 최대 30초, 480p/720p/1080p 및 오디오 동기화를 안내하며 Prime은 더 빠른 대신 더 비싸다고 안내한다."
  - "Genjutsu Restyle은 원본 영상의 움직임·샷 구성·오디오를 유지하며 스타일을 바꾸는 별도 편집 경로다. 모션 전이·오브젝트 교체와 같은 기능으로 뭉뚱그리지 말고 해당 Restyle 스타일 선택을 명시한다. 공식 API 문서에는 별도 restyle 모델이 있으나 현재 연결 MCP 모델 검색에는 항목이 없다."
  - "GPT Image 2.5에서 Flare는 일반 작업 기본, Sunburst는 편집 정밀 제어용이다. 현재 연결 카탈로그는 두 변형을 함께 노출하며 1K/2K/4K와 이미지 참조 입력을 지원한다."
  - "Seedream 5.0 Flash는 빠른 생성·지시형 편집을 한 모델에서 제공하고 1K/1.5K/2K를 지원한다. 현재 연결 카탈로그는 이미지 참조를 노출한다. FLUX 3 Image는 생성/이미지 편집 모델로 공식 공지상 768p/1K/1.5K/2K/4K를 제공한다."
  - "영상 편집형 요청은 실제 기능을 구분한다: Genjutsu Restyle은 스타일 변환, Genjutsu Motion Transfer는 움직임 전이, Object Swap은 대상 교체. 하나의 광고 영상에서 여러 요소를 독립 변형하는 요청은 Ad Multiplier 워크플로우."
routing_table:
  discover: "models_search → 필요하면 models_get; 모호한 요청은 models_recommend"
  generate: "generate_image / generate_video / generate_audio; 3D는 현재 노출된 전용 도구를 확인"
  edit: "Higgsfield UI/API의 전용 편집 기능; Genjutsu Restyle·Motion Transfer·Object Swap은 기능별로 구분"
  narrative_video: "요청에 맞는 공식 프리셋/워크플로 확인 → 연결 시 get_preset_instructions 등으로 지침 로드"
pitfalls:
  - "업스케일이면 될 것을 재생성 프롬프트로 만드는 것 — 비용 낭비 + 원본 유실"
  - "과거 MCP 도구명이나 플랫폼 전체 라인업을 현재 연결에서 사용 가능하다고 가정하는 것"
