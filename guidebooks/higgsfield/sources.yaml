    note: "11/21: 0~200k자 읽음(200k~241k자 미확인). 일자 표시 공지 — Seedance 2.5 Flash(11/12), Seedream 5.5(11/09), Kling Image 4.0(11/17), Intone(10/30), Cinema Studio 4.0(08/12), FLUX 3 Video Upscaler(08/28·10/15), Grok Imagine Video 1.5(10/01), Kimi K3.1 Pro(10월). 월 단위만 표시된 11월 항목(Seedance 2.5 4K 업데이트, Gemini 4 Neon·Carbon, GPT-6.2 Astra/Sol, Claude Fable 5.2, Inkling 2 Small, Gemini Omni Flash 1.2 등) — 정확한 일자는 미확인이며 뒤쪽 100k자 이후는 미확인. 11/09 이전 항목(11/09 대조 포함): GPT Image 2.6(11/05), Gemini Omni Flash 1.2(11/05), Kling 4.0 Flash(11/04), Kling 4.0(10월). 10/14 대조: GPT Image 2.5, Seedream 5.0 Flash, Wan 3.0/Prime, Grok Imagine Video 1.5, FLUX 3 Image, Genjutsu Restyle, Seedance 2.5 Draft Mode 등"
