id: prompting
model: ideogram
topic: "Ideogram 4.0/4.5 프롬프트·Magic Prompt·텍스트·스타일"
verification: partial
last_verified: "2026-10-27"
note: "공식 4.0 작성법·4.5 API를 대조했다. 템플릿은 로컬 권장이며 실제 생성 품질 A/B는 수행하지 않았다."
rules:
  - "공통 이미지 제작 지침은 _shared/image-production을 따른다. Ideogram 고유의 분기와 필드만 이 카드에서 다룬다."
  - "버전을 먼저 식별한다. Ideogram 4.0 공식 가이드의 권장 기법을 4.5의 성능 사실로 일반화하지 않는다. 4.5 생성 API 문서는 Ideogram 4.0 구조화 JSON 형식도 입력으로 받는다고 명시한다."
  - "4.0 공식 가이드는 자유 자연어에 Magic Prompt를 쓰는 탐색형 모드와, 명시적 필드로 구성한 구조화 JSON 프롬프트 모드를 설명한다. JSON의 핵심 역할은 high_level_description, style_description, compositional_deconstruction(background, elements)로 구분한다."
  - "4.0 구조화 JSON을 작성할 때는 사진형의 style_description 필드 순서(aesthetics, lighting, photo, medium, color_palette)와 비사진형 순서(aesthetics, lighting, medium, art_style, color_palette)를 보존한다. 사진형과 비사진형 필드를 섞지 않는다. 이 순서 권고를 4.5 고유 요구로 주장하지 않는다."
  - "Magic Prompt는 자연어를 확장·구조화하는 기능이다. API 호출 시 magic_prompt는 요청 본문의 별도 설정 필드이며, JSON 내부에 넣는 필드가 아니다. 4.0·4.5 API에서 값은 auto/on/off다. 유효한 구조화 JSON은 기본적으로 Magic Prompt를 건너뛰지만 on이면 예외다."
  - "4.5의 magic_prompt=off는 문구를 보존하면서 구조화 프롬프트로 변환하는 설정이지, 임의의 JSON 지시문이 아니다. 자연어 입력과 JSON 캡션을 혼동하지 말고, API 설정은 프롬프트 본문과 분리해 낸다."
  - "이미지 안의 문구는 사용자가 준 정확한 문자열을 그대로 둔다. 줄바꿈·대소문자·문장부호도 임의로 다듬지 않는다. 텍스트 요소를 JSON으로 표현하는 경우 API가 허용하는 캡션 스키마를 따른다."
  - "참조 이미지에서 재사용할 시각 스타일을 추출하는 것은 4.0 블로그의 워크플로 예시로 안내할 수 있다. 자동 추출 기능이 모든 Ideogram 버전·제품 경로에 존재한다고 말하지 않는다."
template: |
  목적: {사용처와 이미지 목표}
  모드: {탐색이면 자연어와 Magic Prompt 설정; 정확한 배치/문구면 구조화 JSON을 지원하는 경로에서만 명시}
  장면: {피사체와 필요한 배경/배치}
  스타일: {원하는 매체, 조명, 팔레트; 불필요하면 생략}
  문구: {사용자 원문 그대로; 없으면 생략}
  API 설정(프롬프트와 분리): {예: magic_prompt=off — 요청 경로에서 지원할 때만}
example: |
  프롬프트: 세로형 카페 포스터. 크림색 바탕의 아래쪽 중앙에 커피잔 하나를 놓고, 상단에 "오늘의 커피"를 한국어 원문 그대로 한 번 표시한다. 제목은 짙은 갈색의 읽기 쉬운 세리프체, 나머지 공간은 여백으로 둔다.
  API 설정(지원 경로에서 별도 전달): magic_prompt=off. 자연어 문구를 확장하지 않고 구조화 변환하며, 결과의 한글 정확성은 따로 검수한다.
pitfalls:
  - "4.0 JSON 훈련 설명을 4.5의 미검증 품질 주장으로 옮기는 것"
  - "magic_prompt를 JSON 캡션 내부 필드로 취급하거나, API 인자명을 사용자용 프롬프트 지시문으로 출력하는 것"
  - "정확한 사용 문구를 자연스럽게 고친다며 번역·수정하는 것"
