model: ideogram
label: "Ideogram 4.0 / 4.5"
output_language: follow-target
slots:
  required:
    - id: image_goal
      ask: "어떤 이미지를 어디에 쓰나요? (피사체와 용도)"
  optional:
    - id: model_version
      default: "사용자가 지정한 버전; 미지정이면 Ideogram 4.5를 후보로 안내하되 실행 버전을 단정하지 않음"
    - id: execution_route
      default: "명시된 경로 우선; API면 모델 ID·엔드포인트 버전을 분리"
      note: "현재 세션의 Ideogram 연결, 계정 권한 또는 품질 검증을 주장하지 않는다."
    - id: references
      default: "없음"
    - id: text_in_image
      default: "요청의 정확한 문구를 그대로 보존"
cards:
  - id: prompting
    when: "항상 로드 (자연어·Magic Prompt·구조화 JSON·문구·스타일)"
  - id: editing-runtime
    when: "참조/편집, API·앱·MCP 경로, 모델 버전 또는 파라미터가 관련될 때"
