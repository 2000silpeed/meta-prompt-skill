id: long-horizon-agent
model: moonshot-kimi
topic: "K3 장기 에이전트 작업 — 추론 히스토리와 캐시"
verification: partial   # 플랫폼 문서 + 공개 릴리스 노트 기반. 프롬프팅 전용 공식 가이드는 없음
rules:
  - "K3는 세션 전체에 걸쳐 추론 히스토리를 보존하도록 훈련됐다. 하네스가 그 히스토리를 정확히 되돌려 보내지 않으면 출력 품질이 불안정해진다 — 커스텀 하네스를 쓸 때는 짧은 멀티턴으로 먼저 검증한다."
  - "긴 코드베이스 작업은 '기능 하나를 끝까지'처럼 목표를 크게 주는 편이 잘 맞는다. 다만 완료 조건과 검증 명령은 측정 가능하게 적는다."
  - "반복되는 큰 컨텍스트(레포 요약, 규약 문서)는 프롬프트 앞쪽 고정 위치에 두고, 매 요청 달라지는 부분을 뒤에 둔다. 캐시 히트 시 입력 비용이 크게 떨어진다."
  - "긴 실행에서 진행·완료 주장은 실제 실행 결과로 검증하게 하고, 실패·생략 항목을 그대로 보고하도록 지시한다(일반 에이전트 원칙 — 모델 전용 공식 지침은 아님)."
template: |
  # Goal
  {task_goal — 크게, 끝까지}
  # Stable context (캐시 대상, 앞에 고정)
  {repo_map / conventions / 기존 결정}
  # This request (매번 달라지는 부분)
  {구체 요청}
  # Done when
  {검증 명령과 완료 조건}
pitfalls:
  - "추론 히스토리를 요약·편집해 되돌려 보내 품질이 흔들리는 것"
  - "고정 컨텍스트를 매번 다른 위치에 넣어 캐시를 무효화하는 것"
