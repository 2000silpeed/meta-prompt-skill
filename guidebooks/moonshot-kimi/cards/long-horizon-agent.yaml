id: long-horizon-agent
model: moonshot-kimi
topic: "K3.1 멀티턴 에이전트 — 메시지 히스토리와 도구"
verification: partial
last_verified: "2026-10-27"
note: "K3.1 API 사실은 공식 문서 대조; 완료 조건·검증 템플릿은 일반 운영 권장. messages/tool_call_id 예시는 Chat Completions이며 다른 프로토콜에는 해당 이벤트·결과 형식을 사용한다."
rules:
  - "Kimi API는 상태가 없다. 각 요청에 필요한 대화 메시지 히스토리를 클라이언트가 다시 보낸다. 프롬프트의 장기 목표만으로 세션 상태가 보존된다고 기대하지 않는다."
  - "도구 호출 턴 뒤에는 반환된 assistant 메시지 전체를 변경 없이 히스토리에 넣고, 각 호출에 맞는 tool_call_id의 tool 결과를 추가한다. content만 보존하거나 reasoning_content/tool_calls를 버리지 않는다."
  - "도구는 JSON Schema로 명확히 정의한다. 도구 실행은 애플리케이션이 담당하며, 실행 결과를 tool 메시지로 돌려보낸 뒤 최종 응답을 요청한다. 필요한 첫 호출을 강제할 때만 tool_choice=required를 쓰고, 이후엔 상황에 맞춰 조정한다."
  - "도구가 수십 개 이상이면 모든 정의를 매 요청에 넣지 말고 검색 후 필요한 정의만 동적으로 주입한다. 공식 문서상 정의는 system 메시지 위치부터 유효하므로 이후 히스토리에도 유지한다."
  - "반복되는 안정 컨텍스트를 앞쪽에 고정하는 것은 캐시 적중률을 위한 일반적 구현 권고다. Kimi API 캐시는 자동이며, 실제 적중 여부·TTL·비용은 호출 조건과 사용량을 확인한다."
  - "완료 조건과 검증 방법을 명시하고 실행 결과만 완료 근거로 삼는 것은 일반 에이전트 운영 권고이며, Kimi 전용 공식 프롬프트 규칙으로 취급하지 않는다."
template: |
  # Goal
  {완료할 작업과 성공 조건}
  # Stable context
  {반복해서 필요한 저장소 규약·결정 — 캐시 활용은 API 사용량으로 확인}
  # This turn
  {이번 단계의 구체 요청}
  # Done when
  {검증 조건과 결과 보고 형식}

  # API 하네스 메모
  assistant 응답 전체와 tool_call_id별 실행 결과를 다음 messages에 보존한다.
pitfalls:
  - "API가 이전 요청을 기억한다고 생각하고 대화 히스토리를 생략하는 것"
  - "assistant 메시지에서 content만 남겨 reasoning_content 또는 tool_calls를 누락하는 것"
  - "도구 결과를 호출 ID에 대응하지 않거나, 모델이 만든 호출을 실행하지 않고 완료로 취급하는 것"
  - "도구 카탈로그 전체를 매번 제공해 불필요한 컨텍스트를 쓰는 것"
