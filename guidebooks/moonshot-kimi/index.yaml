model: moonshot-kimi
label: "Moonshot Kimi (K3.1 Pro)"
output_language: follow-target

slots:
  required:
    - id: task_goal
      ask: "이 프롬프트로 Kimi가 정확히 무엇을 해내야 하나요?"
  optional:
    - id: model_variant
      default: "사용자가 명시한 버전 우선; 미지정이면 kimi-k3.1-pro"
      note: "공식 quickstart 기본. 응답 속도 우선이면 kimi-k3.1-pro-highspeed(공식 설명상 약 2–3배 속도, 1M 컨텍스트). API 모델 ID는 호출 전에 모델 목록에서 확인"
    - id: reasoning_effort
      default: "K3.1 Pro는 작업에 맞춰 low / high / max 선택; 미설정 시 API 기본 max"
      note: "K3.1 Pro는 항상 thinking 모드. reasoning_effort는 최상위 API 필드이며, 명시된 구버전에는 그 버전 사양을 확인"
    - id: deployment
      default: "API 호출"
      note: "Chat Completions / Responses(OpenAI 호환), Messages(Anthropic 호환). 에이전트는 완전한 assistant 메시지와 tool 결과를 히스토리에 보존"
    - id: output_format
      default: "자유 산문"

cards:
  - id: k3-runtime
    when: "항상 로드 (모델 선택과 reasoning_effort)"
  - id: long-horizon-agent
    when: "장기 코딩·멀티턴 API·도구 호출 루프일 때"
