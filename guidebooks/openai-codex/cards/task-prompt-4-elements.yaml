id: task-prompt-4-elements
model: openai-codex
topic: "태스크 프롬프트 4요소 — Goal, Context, Constraints, Done when"
verification: partial   # 2026-11-21 GPT-6.2 Astra·Sol 출시·모델 ID·카탈로그 항목 대조(모델 페이지·whats-new·changelog); 10/28 Terra 선택·CLI 조건 확인; 기존 태스크 프롬프트 지침은 10/14 검증 유지. 6.2의 effort·CLI 최소 버전은 미확인
last_verified: "2026-11-21"
rules:
  - "복잡한 태스크는 Goal(무엇을 바꾸거나 만들 것인가) / Context(관련 파일·문서·에러) / Constraints(지킬 표준·아키텍처·금지) / Done when(완료 기준)을 기본 골격으로 쓴다. 단순한 요청에 불필요한 항목이나 고정 서식을 강제하지 않는다."
  - "한 번의 실행에 한 태스크만. 무관한 요청은 별도 실행으로 분리한다."
  - "파일 참조는 경로:줄번호로 (src/app.ts:42). file:// 나 vscode:// URI는 쓰지 않는다."
  - "완료 상태를 추론하게 두지 않는다 — done의 모습을 명시할 것."
  - "2026-11-21 OpenAI best-practices 페이지 기준: 가능하면 GPT-6.2 Sol로 대부분의 작업을 시작하고, 여러 패키지에 걸친 변경은 모델 선택기에서 GPT-6.2 Astra를 고른다. Effort는 빠르고 범위가 좁은 작업은 low, 더 복잡한 변경·디버깅은 medium 또는 high, 길고 에이전트적이며 추론이 무거운 작업은 xhigh로 안내된다. 같은 페이지에서 GPT-6 Luna는 high, GPT-6 Astra는 low에서 시작하라고 한다(페이지가 'GPT-6.2 Astra'와 'GPT-6 Astra'를 섞어 쓰므로 실제 선택 목록에서 확인). 모델별 API 파라미터 권고가 필요하면 openai-gpt-5/cards/gpt-6.yaml을 함께 읽는다."
  - "복잡하거나 모호한 작업은 플랜 모드(/plan)를 먼저 — 또는 'Codex가 먼저 인터뷰하게 하라'."
  - "복잡한 코딩·에이전트 작업은 계정에서 쓸 수 있는 GPT-6.2 Sol(없으면 GPT-6.1 Sol)을 기본 후보로 둔다. 실제 사용 중인 모델과 사용자 지정 버전을 유지하고, 지침 갱신만으로 모델 설정이 바뀌었다고 보고하지 않는다."
  - "시각 이해·화면 조작·글쓰기는 계정·클라이언트에서 사용 가능한 GPT-6.1 Terra도 검토한다. Codex CLI에서는 0.159.0 이상이 필요하며 codex -m gpt-6.1-terra로 선택한다. 이 최소 버전은 CLI 조건으로, API 모델 사용 조건과 혼동하지 않는다."
  - "GPT-6.2 Astra(gpt-6.2-astra)와 GPT-6.2 Sol(gpt-6.2-sol)은 2026-11-17 출시됐다(OpenAI whats-new 페이지 일자). Astra는 여러 서비스에 걸친 버그 추적·보고서를 덱으로 만드는 등 어려운 작업, Sol은 일상 코딩·글쓰기·다단계 작업에 쓰도록 안내된다. Codex 체인지로그 요약(2026-11-20 CLI 0.171.0 항목)에서 카탈로그 추가와 Sol 기본 선택이 언급된다(요약 도구 기준, 원문 직접 확인 미완). 6.2의 CLI 최소 버전은 확인되지 않았다. 6.1 규칙을 6.2에 그대로 옮기지 않는다. 6.2의 컨텍스트 창은 열어 본 공식 페이지에 없어 확인되지 않았다(검색 요약의 1M 수치는 미확인)."
  - "GPT-5.5는 2026-10-14 ChatGPT·Work·Codex에서 은퇴한다. ChatGPT 로그인 경로의 저장 설정·커스텀 에이전트·태스크에서 지정했다면 이용 가능한 GPT-6 계열로 이전한다. 이 은퇴는 OpenAI API에 적용되지 않는다."
  - "다른 Codex 태스크를 @ 멘션으로 참조할 수 있다. 선행 태스크의 결과를 이어받는 프롬프트라면 그 태스크를 명시적으로 가리킨다."
template: |
  Goal: {무엇을 바꾸거나 만든다}
  Context: {관련 파일 경로:줄번호, 에러 로그, 참고 문서}
  Constraints: {지킬 관례·아키텍처, 금지 사항}
  Done when: {테스트/빌드 통과 조건, 확인할 동작}
pitfalls:
  - "완료 기준 없는 태스크 — '적당히 됐다'에서 멈추거나 과잉 구현한다"
  - "여러 태스크를 한 프롬프트에 욱여넣기"
