id: workflow-antipatterns
model: openai-codex
topic: "워크플로우 안티패턴 — 마무리 점검 체크리스트"
verification: verified   # 2026-07-22 공식 가이드 + 로컬 플러그인 대조
rules:
  - "반복 규칙이 프롬프트에 있다 → AGENTS.md로 옮길 것."
  - "빌드·테스트 명령을 안 줬다 → Codex가 검증 못 하는 프롬프트는 미완성."
  - "복잡한 작업을 계획 없이 시작 → 플랜 모드 선행."
  - "작업 전 전체 권한 부여 → 필요한 범위만."
  - "라이브 파일에서 병렬 작업 → git worktree로 격리."
  - "에이전트 감시(babysitting) → 병렬 태스크로 돌리고 결과만 확인."
  - "전체 프로젝트를 한 채팅으로 → 채팅(스레드)당 하나의 결과물."
  - "반복 작업을 매번 프롬프트로 → 스킬로 패키징(하나의 작업, 명확한 입출력, 언제 쓰는지 명시). 안정화되면 예약 작업으로: '스킬은 방법을, 작업은 일정을 정의한다.'"
final_checklist:
  - "4요소(Goal/Context/Constraints/Done when) 충족"
  - "검증 명령 포함"
  - "한 실행 = 한 태스크"
  - "반복 규칙은 AGENTS.md에"
pitfalls:
  - "이 카드의 항목이 프롬프트 문제가 아니라 워크플로우 문제인데 프롬프트만 고치려 드는 것"
