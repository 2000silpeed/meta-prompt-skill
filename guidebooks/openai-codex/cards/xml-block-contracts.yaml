id: xml-block-contracts
model: openai-codex
topic: "XML 블록 계약 — 오퍼레이터처럼 프롬프트하기"
verification: verified   # 2026-07-22 공식 가이드 + 로컬 플러그인 스킬 대조
rules:
  - "협업자가 아니라 오퍼레이터처럼: 짧고 블록 구조화된 프롬프트. <task> + 출력 계약 + 기본 진행 정책 + 필요한 제약만."
  - "기본 레시피: <task>(구체적 작업+레포/실패 맥락), <structured_output_contract>(출력 형태·순서·간결성), <default_follow_through_policy>(일상적 질문 대신 기본으로 할 행동), <verification_loop>(디버깅·구현·위험 수정에 필수), <grounding_rules>(리뷰·리서치에 필수 — 근거 없는 주장 방지)."
  - "모드별 블록: 코딩/디버깅 → completeness_contract + verification_loop / 리뷰 → grounding_rules + structured_output_contract / 리서치 → citation_rules / 쓰기 가능 태스크 → action_safety(무관한 리팩토링 방지)."
  - "reasoning을 올리기 전에 프롬프트 계약을 먼저 조인다 — 더 나은 계약이 더 높은 effort보다 낫다."
  - "같은 스레드 후속 지시는 델타만 보낸다(--resume-last) — 방향이 크게 바뀌지 않는 한 전체 재진술 금지."
  - "행동 편향을 명시한다: '합리적 가정으로 구현을 기본으로 하고, 진짜 막힌 경우가 아니면 질문으로 끝내지 마라.'"
template: |
  <task>{작업 + 레포 맥락}</task>
  <structured_output_contract>{출력 형태·순서}</structured_output_contract>
  <default_follow_through_policy>불확실하면 합리적 가정으로 진행하고 가정을 보고한다.</default_follow_through_policy>
  <verification_loop>{테스트/체크 명령과 통과 기준}</verification_loop>
pitfalls:
  - "긴 자연어 설명으로 정밀성을 흉내 내는 것 — 블록 계약으로 구조화할 것"
  - "출력 계약 없이 호출해 파싱 불가능한 산문을 받는 것"
