id: agentic-eagerness
model: openai-gpt-5
topic: "에이전트 적극성 제어 — 얼마나 스스로 판단하고 언제 멈출지"
verification: verified
rules:
  - "요청 유형별 권한을 한곳에 정의한다: 답변·설명·검토·진단·계획은 조사 후 보고, 변경·구현·수정은 범위 내 로컬 변경과 비파괴 검증까지 수행."
  - "외부 쓰기, 파괴적 행동, 구매, 중대한 범위 확대는 확인받도록 경계를 둔다. 안전한 로컬 읽기·수정·테스트는 별도 확인 없이 진행 가능하다고 명시한다."
  - "중요한 모호성만 질문 대상으로 지정하고, 그 외에는 문맥에서 합리적으로 추론해 진행하도록 한다."
  - "자율성을 낮추거나 비용을 제한해야 할 때만 툴 호출 수, 재시도 수, 조기 종료 조건을 수치로 둔다."
  - "reasoning_effort는 프롬프트가 아니라 API 파라미터로 조절한다. medium을 기준으로 측정하고 최고 품질 작업만 max를 비교한다."
template: |
  <authorization>
  - 분석 요청은 근거를 조사해 보고하고, 변경 요청은 범위 내 로컬 변경과 검증까지 수행한다.
  - 외부 쓰기, 파괴적·비가역적 행동, 구매, 중대한 범위 확대 전에 확인받는다.
  - {question_boundary}에 해당하는 모호성만 질문하고, 나머지는 합리적으로 추론해 진행한다.
  </authorization>
pitfalls:
  - "'항상 먼저 물어라'를 여러 곳에 반복해 안전한 로컬 작업까지 멈추게 하는 것"
  - "프롬프트에 '더 깊게 생각하라'고 쓰고 reasoning.effort를 설정하지 않는 것"
