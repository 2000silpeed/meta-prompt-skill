id: agentic-eagerness
model: openai-gpt-5
topic: "에이전트 적극성 제어 — 얼마나 스스로 판단하고 언제 멈출지"
verification: knowledge-based
rules:
  - "자율성을 높이려면 persistence 블록을 넣는다: '불확실해도 사용자에게 되묻지 말고 가장 합리적인 가정으로 진행하고, 가정을 결과와 함께 보고하라. 태스크가 완전히 끝나기 전에 턴을 종료하지 마라.'"
  - "자율성을 낮추려면(빠른 응답 우선) 탐색 예산을 명시한다: '툴 호출 최대 N회', '핵심 근거를 찾으면 즉시 중단', 'early stop 기준' 명시."
  - "reasoning_effort 파라미터와 프롬프트를 짝 맞춘다: 높은 effort + 낮은 자율성 지시는 서로 싸운다."
  - "중단 조건(stop conditions)과 안전 조건(위험한 행동은 확인받기)을 분리해 명시한다."
  - "불확실성 처리 규칙을 항상 포함: 언제 가정으로 진행하고 언제 반드시 물어야 하는지."
template: |
  <persistence>
  - 태스크가 완전히 해결될 때까지 계속 진행한다.
  - 불확실하면 가장 합리적인 접근을 스스로 결정해 진행하고, 가정은 완료 후 보고한다.
  - {autonomy_level에 맞는 추가 규칙}
  </persistence>
  <tool_budget>
  - 탐색 툴 호출은 최대 {N}회. {early_stop_criteria}를 만족하면 즉시 실행으로 전환.
  </tool_budget>
pitfalls:
  - "'신중하게 하라'는 모호한 지시 — 탐색 예산·중단 조건 같은 측정 가능한 규칙으로 바꿀 것"
  - "persistence 지시와 '확실하지 않으면 물어봐라'를 동시에 넣는 모순"
