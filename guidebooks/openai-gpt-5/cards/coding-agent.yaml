id: coding-agent
model: openai-gpt-5
topic: "코딩 에이전트 프롬프트 (Codex 포함)"
verification: knowledge-based
rules:
  - "컨텍스트 수집 한도를 명시한다: '관련 파일만 읽고, 저장소 전체 탐색 금지. 같은 파일 재탐색 금지.'"
  - "코드베이스 규약 준수를 명시한다: '주변 코드의 스타일·네이밍·라이브러리 선택을 따르라. 새 의존성 추가는 금지(또는 확인 필요).'"
  - "과잉 구현 방지 규칙: '요청된 변경만 구현. 리팩토링·기능 추가 금지. 요청 범위 밖 수정이 필요해 보이면 보고만.'"
  - "검증 요구를 명시한다: '변경 후 테스트/빌드로 검증하고 실패 시 결과를 그대로 보고.'"
  - "프론트엔드 작업이면 사용할 스택·컴포넌트 라이브러리를 프롬프트에 고정한다 (모델 임의 선택 방지)."
template: |
  # Task
  {task_goal}
  # Context rules
  - 관련 파일만 탐색하고, 충분한 근거가 모이면 즉시 구현으로 전환한다.
  # Code rules
  - 기존 코드베이스의 스타일과 규약을 따른다.
  - 요청된 변경만 구현한다. 범위 밖 개선은 제안만 한다.
  # Verification
  - {테스트/빌드 명령}으로 검증하고 결과를 보고한다.
pitfalls:
  - "'좋은 코드를 짜라' 같은 무규약 지시 — 모델이 임의 스타일로 대규모 리팩토링을 시도할 수 있다"
