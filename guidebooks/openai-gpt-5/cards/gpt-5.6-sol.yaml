id: gpt-5.6-sol
model: openai-gpt-5
topic: "GPT-5.6 Sol — 모델 선택, 추론 설정, 간결한 결과 중심 프롬프트"
verification: verified
rules:
  - "최고 역량이 필요한 복잡한 전문 작업에는 gpt-5.6-sol을 쓴다. gpt-5.6 별칭도 Sol로 라우팅된다. 비용 균형은 Terra, 고처리량·저비용은 Luna를 검토한다."
  - "프롬프트는 결과 중심으로 간결하게 쓴다. 목표, 관련 맥락, 하드 제약, 승인 경계, 필요한 근거, 성공 기준, 출력 형식만 남기고 반복 지시와 불필요한 예시를 제거한다."
  - "reasoning.effort는 medium을 균형 기준으로 두고, 지연 민감 작업은 low, 측정된 품질 향상이 있는 어려운 작업은 high/xhigh, 최고 품질 우선 작업은 max를 비교한다."
  - "GPT-5.5/5.4에서 이전할 때 기존 effort와 한 단계 낮은 effort를 같은 대표 과제로 비교한다. GPT-5.6은 더 적은 토큰으로 동등 이상 품질을 낼 수 있다."
  - "pro 모드는 별도 모델명이 아니라 reasoning.mode: pro로 켠다. 프롬프트에 '더 깊게 생각하라'고 쓰지 말고 동일한 결과 중심 프롬프트로 표준 모드와 평가한다."
  - "멀티턴 목표·가정·우선순위가 유지되면 reasoning.context: all_turns(기본/auto)와 previous_response_id를 사용하고, 이전 추론이 무관해지면 current_turn으로 전환한다."
template: |
  # Outcome
  {task_goal}
  # Context
  {relevant_context_only}
  # Constraints and approval boundaries
  {hard_constraints_and_actions_requiring_confirmation}
  # Success criteria and evidence
  {acceptance_conditions_and_required_evidence}
  # Output
  {output_format_and_required_content}

  API 권고: model=gpt-5.6-sol, reasoning.effort={effort}, text.verbosity={verbosity}
pitfalls:
  - "GPT-5.6의 의도 추론 능력을 막을 정도로 모든 절차를 중복·과잉 규정하는 것"
  - "최고 품질이 필요하지 않은 작업에 max/pro를 기본 적용해 지연과 비용을 늘리는 것"
  - "pro를 모델 slug 또는 프롬프트 문구로 지정하는 것"
