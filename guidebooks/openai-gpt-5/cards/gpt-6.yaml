pitfalls:
  - "GPT-6.2 Astra·Sol에 reasoning.effort none을 지정하는 것, 또는 6.1 Sol의 effort 목록을 6.2 지원값으로 가정하는 것"
  - "재사용 지시를 top-level instructions에만 두어 캐시 대상에서 빠뜨리는 것"
  - "GPT-6 Astra·GPT-6.1 Sol에 none/minimal을 지정하거나 Codex 전용 effort를 API 지원값으로 가정하는 것"
  - "GPT-6 Sol의 Chat Completions 함수 호출 설정을 GPT-6.1 Sol에 그대로 적용하는 것"
  - "GPT-6.1 Terra가 none을 지원한다는 이유로 Chat Completions 툴 호출도 가능하다고 가정하거나, 구형 GPT-5.6 Terra를 자동 교체하는 것"
  - "GPT-5.6 Sol 전용 카드를 GPT-6 Sol에 적용하는 것"
  - "새 모델 등록을 실제 계정 접근권한이나 실행 성공으로 해석하는 것"
