id: instruction-precision
model: openai-gpt-5
topic: "지시 정밀성 — 목표·경계·성공 기준을 중복 없이 명시"
verification: verified
rules:
  - "GPT-5.6은 사용자의 의도를 잘 추론하므로 절차를 과도하게 지시하지 않는다. 목표, 도메인 맥락, 하드 제약, 승인 경계, 성공 기준을 우선한다."
  - "모호하거나 상충하는 지시를 먼저 제거하고, 같은 지시는 한 번만 쓴다. 반복 지시는 토큰을 늘리고 불필요한 승인 요청을 유발할 수 있다."
  - "지시는 스펙처럼 쓴다: 목표 → 관련 맥락 → 제약·승인 경계 → 성공 기준 → 출력 형식 순의 간결한 구조."
  - "우선순위 충돌이 예상되면 명시적 우선순위를 준다 (예: '규칙 A와 B가 충돌하면 A를 따른다')."
  - "측정 가능한 품질 기준을 명시한다. '좋은 요약'보다 '결론·근거·중요한 단서·다음 행동을 포함'처럼 보존해야 할 정보를 정한다."
  - "예시와 스타일 규칙은 제품 요구사항을 담거나 측정된 실패를 교정할 때만 유지한다."
template: |
  # Outcome
  {task_goal}
  # Relevant context
  {input_description_and_domain_context}
  # Constraints
  {constraints_and_approval_boundaries}
  # Success criteria
  {measurable_acceptance_conditions}
  # Output format
  {output_format}
pitfalls:
  - "모델이 추론할 수 있는 모든 절차를 장황하게 열거하는 것 — GPT-5.6에서는 간결한 결과 중심 명세가 더 안정적"
  - "system prompt와 user prompt에 서로 다른 톤·형식·승인 규칙을 두는 것"
