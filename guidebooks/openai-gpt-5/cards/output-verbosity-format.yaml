id: output-verbosity-format
model: openai-gpt-5
topic: "출력 길이·형식 제어"
verification: knowledge-based
rules:
  - "전역 길이는 verbosity API 파라미터로, 국소 예외는 프롬프트로 오버라이드한다 (예: 전역 low + '코드 설명만은 상세히')."
  - "형식 요구는 출력 직전 위치보다 명시적 섹션(# Output format)에 둔다. 스키마가 있으면 structured outputs(json_schema)를 쓰라고 권고."
  - "마크다운 사용 여부를 명시한다. API 기본값은 마크다운 미보장 — 필요하면 '마크다운 헤더/리스트로 구성'을 명시."
  - "길이 제한은 단위로 준다: '3문장', '500자 이내' — '간결하게'는 모델마다 해석이 다르다."
template: |
  # Output format
  - {format: JSON 스키마 / 마크다운 구조 / 플레인 텍스트}
  - 길이: {구체적 단위}
  - {예외 규칙: 어떤 부분만 길게/짧게}
pitfalls:
  - "JSON을 프롬프트로만 강제하는 것 — 파싱이 필요하면 structured outputs 기능을 쓰는 편이 안전"
