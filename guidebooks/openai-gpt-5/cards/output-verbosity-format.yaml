id: output-verbosity-format
model: openai-gpt-5
topic: "출력 길이·형식 제어"
verification: verified
rules:
  - "전역 길이는 text.verbosity(low/medium/high)로, 국소 예외는 프롬프트로 오버라이드한다 (예: 전역 low + '코드 설명만은 상세히')."
  - "GPT-5.6은 GPT-5.5보다 기본 응답이 간결하므로 광범위한 '짧게' 지시를 관성적으로 유지하지 않는다. 필요한 정보가 빠지는지 대표 과제로 확인한다."
  - "짧은 답에서도 보존할 항목(결론, 근거, 중요한 단서, 다음 행동)과 먼저 생략할 항목(도입, 반복, 일반론)을 명시한다."
  - "형식 요구는 출력 직전 위치보다 명시적 섹션(# Output format)에 둔다. 스키마가 있으면 structured outputs(json_schema)를 쓰라고 권고."
  - "마크다운 사용 여부를 명시한다. API 기본값은 마크다운 미보장 — 필요하면 '마크다운 헤더/리스트로 구성'을 명시."
  - "길이 제한은 단위로 준다: '3문장', '500자 이내' — '간결하게'는 모델마다 해석이 다르다."
template: |
  # Output format
  - {format: JSON 스키마 / 마크다운 구조 / 플레인 텍스트}
  - 길이: {구체적 단위}
  - {예외 규칙: 어떤 부분만 길게/짧게}
pitfalls:
  - "JSON을 프롬프트로만 강제하는 것 — 파싱이 필요하면 structured outputs 기능을 쓰는 편이 안전"
  - "'간결하게'만 추가해 필수 근거와 단서까지 잘라내는 것"
