id: tool-preambles-planning
model: openai-gpt-5
topic: "툴 프리앰블과 계획 — 장시간 작업의 가시성과 계획 품질"
verification: knowledge-based
rules:
  - "긴 에이전트 작업에는 tool preamble 지시를 넣는다: 사용자 목표를 재진술 → 계획 요약 → 툴 호출마다 한 줄 진행 보고 → 완료 시 실제 수행 내용 요약."
  - "작업 시작 전 명시적 계획 수립을 요구한다: '시작 전에 단계별 계획을 세우고, 각 단계 완료 시 계획 대비 진행을 점검하라.'"
  - "품질 기준이 중요한 산출물엔 자기 평가 루브릭을 심는다: '먼저 5개 항목의 채점 루브릭을 만들고, 초안을 루브릭으로 자체 평가한 뒤 통과본만 제출하라.'"
template: |
  <tool_preambles>
  - 툴 호출 전 목표를 한 문장으로 재진술하고 계획을 요약하라.
  - 각 툴 호출마다 지금 무엇을 왜 하는지 한 줄로 보고하라.
  - 완료 시 계획과 실제 수행의 차이를 요약하라.
  </tool_preambles>
pitfalls:
  - "프리앰블 지시 없이 verbosity만 낮추면 장시간 작업이 침묵 속에 진행돼 사용자가 불안해진다"
