id: runtime-routing
model: openai-gpt-image
topic: "내장 imagegen / Images API / Responses API 경로"
verification: partial
last_verified: "2026-11-09"
note: "11/09 GPT Image 2.6 API 규칙(모델 선택·complexity·SVG/GIF·markup·크기)을 공식 문서로 대조. 내장 imagegen 스킬·image_gen 스키마 규칙은 10/27 세션 확인분이며 이번에 재확인하지 않음. 모델 성능 실험은 미실행."
rules:
  - "사용자가 imagegen을 지정하거나 일반 이미지 생성을 요청하면 사용 가능한 내장 image_gen을 기본 실행 경로로 삼는다. 현재 imagegen 스킬을 따르고, 프롬프트만 요청했으면 실행하지 않는다."
  - "내장 도구에 model/quality/size/seed/mask 필드가 없으면 만들지 않는다. 프롬프트에 GPT Image 모델명을 써도 백엔드를 선택한 것으로 보고하지 않는다. 특정 API 모델이 필수면 해당 실행 경로의 필요성을 밝힌다."
  - "내장 편집은 로컬 파일을 먼저 view_image로 확인한다. 현재 스키마가 referenced_image_paths를 지원하고 모든 대상의 경로가 있으면 이를 쓴다. 경로 없는 대화 이미지는 num_last_images_to_include로 필요한 최소 범위만 포함하며 두 방식을 함께 쓰지 않는다. 신규 생성은 둘 다 생략한다."
  - "내장 투명 출력은 transparent_background=true를 사용한다. 기존 투명도를 요청 없이 없애지 않는다. 실제 반환 파일을 확인하고 프로젝트용이면 작업공간에 저장한다."
  - "CLI/API는 사용자가 그 경로를 선택한 경우만 사용한다. 내장 실패나 파일 경로·품질 조절을 이유로 유료 API에 자동 전환하지 않는다. 설치된 CLI의 실제 모델 지원도 별도 확인한다."
  - "API 모델을 새로 고를 때 최신 후보는 GPT Image 2.6(2026-11-04 출시)이다. 응답 속도가 가장 중요하면 gpt-image-2.6-flare, 세부·레이아웃·편집 정확도 요구가 높으면 gpt-image-2.6-sunburst에서 시작한다. GPT Image 2나 2.5 Flare로 품질 기준을 채우던 작업은 2.6 Flare, 2.5 Sunburst를 쓰던 작업은 2.6 Sunburst가 이전 출발점이다. 사용자가 지정한 gpt-image-2.5-*·gpt-image-2는 묵시적으로 교체하지 않고, 이전할 때는 롤백용으로 기존 모델을 남겨 둔다."
  - "2.6의 complexity(low/medium/high, 생략 시 두 모델 모두 high, 별도 요금 없음)는 렌더링 전 계획량이며 quality와 별개다. 디자인 결정을 열어 둔 프롬프트는 high, 세부를 다 지정한 프롬프트는 차이가 작을 수 있고, 한 요소만 바꾸는 국소 편집은 low에서 시작한다. quality를 고정한 채 complexity를 비교한다. 2.5 이하 모델에 complexity를 복사하지 않는다."
  - "2.6 생성은 output_format에 svg·gif를 추가로 지원한다. SVG는 generations 전용이며 n=1, stream·partial_images·output_compression 생략, 스크립트·외부 리소스·래스터 임베드가 없는 정적 벡터로 나온다(편집 엔드포인트는 SVG 출력·입력 불가). GIF는 frame_count 2~16(기본 9)과 frame_duration_ms 20~2000(기본 200)을 쓰고 stream·partial_images·output_compression을 지원하지 않는다. 다른 플랫폼이 노출하는 프레임 상한은 그 플랫폼 스키마를 따른다."
  - "Images API는 model을 직접 지정한다. Responses API는 상위 model(대화 모델)과 tools의 image_generation.model(이미지 모델)을 구분하고 반환된 revised_prompt가 있으면 보존한다. 이것은 Codex 내장 image_gen의 호출 스키마가 아니다."
  - "API 설정은 프롬프트와 별도로 제공한다. 2.5·2.6의 quality는 auto/low/medium/high/xhigh/max이며 gpt-image-2 이하에 xhigh/max를 복사하지 않는다. 사용자 지정 크기는 가로·세로 16의 배수와 1:3~3:1 비율을 지킨다. 한 변 3840px 이하·총 픽셀 655,360~8,294,400·2560x1440 초과는 실험적이라는 한도는 image-generation 가이드의 공통 서술이며, 2.6 프롬프팅 가이드는 배수·비율만 적으므로 2.6의 상한은 모델 문서로 확인한다. 투명 출력은 background=transparent와 PNG/WebP(2.6은 SVG도)를 사용하고 알파 채널을 확인한다. gpt-image-2의 투명 출력은 preview다. input_fidelity는 gpt-image-2와 2.6 편집에서 생략하고, 2.6은 reasoning.summary를 지원하지 않는다."
  - "gpt-image-1은 2026-10-23 종료됐고 gpt-image-1.5는 2026-12-01 종료 예정이다. GPT Image 2·2.5의 종료일은 11/09 기준 공지를 확인하지 못했다. 기존 모델 요청은 이 상태를 밝히고 대안을 제시하되 임의로 다른 모델을 실행하지 않는다."
pitfalls:
  - "내장 image_gen, Responses image_generation, imagegen CLI를 같은 인터페이스로 취급하는 것"
  - "공식 API 기능이 곧 현재 연결 도구의 기능이라고 가정하는 것"
  - "SVG·GIF 요청에 stream/partial_images/output_compression을 남기거나, SVG를 편집 엔드포인트로 보내는 것"
  - "문서와 설치된 스킬이 충돌할 때 한쪽의 파라미터를 다른 경로로 복사하는 것 — API는 최신 공식 스키마, 내장 도구는 현재 노출 스키마를 따른다"
