id: grok-4.6-runtime  # 기존 카드 경로·참조 호환을 위해 ID 유지
model: xai-grok
topic: "Grok 4.7 / 4.6 런타임 — 모델 선택, reasoning_effort, 금지 파라미터, 캐시"
verification: verified   # 2026-10-14 docs.x.ai Grok 4.7 model, reasoning, tools, migration guide 대조
rules:
  - "현재 API flagship은 grok-4.7이다(model ID도 grok-4.7). 500K context, 텍스트·이미지 입력, 지식 컷오프 2026-05, reasoning 기본 high. Grok 4.6은 공식 reasoning docs에 계속 지원 모델로 남아 있으므로 레거시 워크로드에서 쓸 수 있다. 1M context는 Grok 4.20 계열, 병렬 심층 리서치는 grok-4.20-multi-agent를 검토한다."
  - "4.7의 reasoning은 low / medium / high(기본) / xhigh이며 끌 수 없다. 지연 민감한 간단한 도구 작업은 low, 분석·롱컨텍스트는 medium, 어려운 수학·다단계 작업은 high, 최난도 작업은 xhigh로 조정한다. xhigh는 4.6 이상에서 지원된다."
  - "reasoning 모델에는 presencePenalty / frequencyPenalty / stop을 함께 보낼 수 없고 요청 오류가 난다. 응답 길이와 중단 기준은 프롬프트의 출력 계약으로 정한다. 최신 reasoning 문서는 Grok 4.7·4.6·4.5에 적용한다고 명시한다."
  - "최신 정보가 필요하면 Web Search 또는 X Search를 요청에서 활성화한다. 모델 자체 지식은 학습 컷오프 이후를 포함하지 않는다."
  - "Responses API의 멀티턴에서는 previous_response_id로 이어갈 수 있다. 4.7은 reasoning.encrypted_content를 항상 반환하므로, 히스토리를 직접 구성할 때 reasoning/tool 출력 항목을 수정하지 말고 다음 input에 그대로 전달한다. Chat Completions 동작은 이 변경에 영향받지 않는다."
  - "캐시를 안정화하려면 Responses API의 prompt_cache_key 또는 Chat Completions의 x-grok-conv-id를 사용하고 이전 메시지는 그대로 둔 채 새 메시지만 붙인다. reasoning 모델은 이전 reasoning_content를 빠뜨리면 캐시 적중이 깨질 수 있다."
  - "추론 요청은 오래 걸릴 수 있다. 공식 API 예시는 3600초 timeout을 쓴다. xhigh는 가장 어려운 문제에만 사용해 지연과 토큰 사용을 관리한다."
  - "grok-4.20-multi-agent에서는 reasoning.effort가 사고 깊이가 아니라 협업 에이전트 수(4 또는 16)를 조절하므로 4.7의 effort 설명을 그대로 적용하지 않는다."
  - "Grok 4.7 Fast는 public xAI API에서 제공되지 않는다. 일반 API 프롬프트에는 grok-4.7을 사용한다."
template: |
  {프롬프트 본문 — 역할 / 맥락 / 과업 / 출력 계약}

  # API 권고
  model: grok-4.7
  reasoning_effort: {low | medium | high(기본) | xhigh}
  prompt_cache_key 또는 x-grok-conv-id: {대화 식별자}
  timeout: 넉넉히 (긴 추론 대비)
pitfalls:
  - "stop / presence_penalty / frequency_penalty를 그대로 이식해 오류를 맞는 것"
  - "캐시 키만 지정하면 수정된 대화 히스토리에도 캐시 적중이 보장된다고 가정하는 것"
  - "지식 컷오프 이후 정보를 검색 툴 없이 물어보고 최신이라고 믿는 것"
  - "multi-agent 변형에서 effort를 사고 깊이로 오해하는 것"
  - "4.7 Fast가 public xAI API의 모델 ID라고 가정하는 것"
