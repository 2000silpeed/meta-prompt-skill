model: xai-grok
label: "xAI Grok (Grok 4.7 / 4.6)"
output_language: follow-target

slots:
  required:
    - id: task_goal
      ask: "이 프롬프트로 Grok이 정확히 무엇을 해내야 하나요?"
  optional:
    - id: model_variant
      default: "grok-4.7"
      note: "현재 flagship. Grok 4.6도 사용 가능; 1M 컨텍스트는 4.20 계열, 심층 병렬 리서치는 4.20 Multi-Agent"
    - id: reasoning_effort
      default: "high"
      note: "4.7 기본 high; low/medium/high/xhigh 지원. reasoning은 끌 수 없음"
    - id: realtime_need
      default: "없음"
      note: "최신 정보·X 여론이 필요하면 서버측 web/X search 툴을 켤지 결정"
    - id: output_format
      default: "자유 산문"

cards:
  - id: grok-4.6-runtime
    when: "항상 로드 (모델 선택·reasoning_effort·API 제약·캐시)"
  - id: tools-and-search
    when: "실시간 검색, X 검색, 코드 실행, 문서 컬렉션, 커스텀 함수 호출이 관련될 때"
