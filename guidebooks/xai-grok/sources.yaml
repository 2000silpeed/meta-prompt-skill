notes:
  - "xAI는 Anthropic/OpenAI 수준의 별도 프롬프팅 가이드를 발행하지 않는다. 카드는 API 문서에서 확인 가능한 사실 + 일반 원칙으로 구성하고, 문서에 없는 부분은 그렇게 표기한다."
